<noscript><h1>Sheetal Jaitly</h1><p>A map of a sales-trained founder who built, nearly lost and rebuilt a software consultancy, and who now tells enterprises to redesign themselves around AI rather than bolt it on.</p><p>This interactive story graph needs JavaScript. The full content follows.</p><ul><li><strong>Sheetal Jaitly</strong>: Founder and CEO of TribalScale, a Toronto-based software and AI consultancy, and the author of a run of 2026 essays on becoming AI-native.</li><li><strong>Shipping desk at Keating</strong>: His first tech job, per a magazine profile, was in shipping and receiving at Keating Technologies, where he watched a company scale fast.</li><li><strong>Copiers, then analytics sales</strong>: He learned to sell at Ricoh and was then recruited by a customer to sell predictive analytics, a product clients did not yet know they wanted.</li><li><strong>Xtreme Labs</strong>: A Toronto mobile-app shop where he joined friends at its launch and, per the profile, helped grow revenue to $37.5m in five years.</li><li><strong>Pivotal buys Xtreme Labs</strong>: In October 2013 Pivotal bought Xtreme Labs; the profile says the company later passed to Dell, and that he struggled to find his place in the larger organisation.</li><li><strong>TribalScale is founded</strong>: He started the company in November 2015, saying he saw a gap in how organisations deliver digital products in an Agile way.</li><li><strong>The $1.2m first client</strong>: In his telling, a media-company buyer he had advised at Pivotal cut his pitch short and signed a $1.2m contract because he had once talked that buyer out of a bigger purchase.</li><li><strong>0 to 100 in two years</strong>: By the second anniversary TribalScale reported 100+ employees and offices in Toronto, California and Dubai, the first stretch of fast growth.</li><li><strong>TakeOver conference</strong>: A conference he started because he wanted a less cookie-cutter tech event in Toronto; it grew from 800 attendees in 2017 to a sold-out 1,700 in 2018.</li><li><strong>Venture Studios</strong>: A startup-creation arm announced in 2018 with a $100 million target, offering $500,000 in cash and support to accepted startups in blockchain, AI and voice.</li><li><strong>Voice and Alexa skills</strong>: An early bet on voice interfaces: TribalScale said in 2017 that Amazon and Google recognised it as an expert builder for their voice platforms.</li><li><strong>A large client leaves (2019)</strong>: He dates the trouble to a large client restructuring and ending its engagement, leaving an oversized team; revenue concentrated in two clients.</li><li><strong>Insolvency filing, May 2020</strong>: Independent trade press reported TribalScale filing a notice of intention under Canada&#39;s Bankruptcy and Insolvency Act, a formal route to restructure rather than go bankrupt.</li><li><strong>Pandemic shock, 2020</strong>: The profile says the company lost most of its customers in early 2020 and he chose to keep serving clients at no charge; the Toronto office closed on March 16.</li><li><strong>Out of creditor protection</strong>: The company says it exited its restructuring proceeding under Canada&#39;s CCAA on January 27, 2021 and describes itself as leaner and healthier.</li><li><strong>The &#39;TribalScale 2.0&#39; essay</strong>: His own account of the reset: what went wrong, how the team shut the office, and why he calls the rebuilt company more sustainable.</li><li><strong>Three sets of growth figures</strong>: Sources give different numbers for the boom years, and none is independently verified, so this map does not pick one.</li><li><strong>Fail Fast</strong>: A motto he hands out on stickers; he frames setbacks as something to learn from quickly, and used it again to describe the 2020 recovery.</li><li><strong>Do right by the client</strong>: A recurring claim in his own accounts: advising clients against a bigger sale, and later serving them free when revenue collapsed, pays back over time.</li><li><strong>Core values after the reset</strong>: After exiting creditor protection he set out the company&#39;s values as Resilience, Empowerment, and Challenge &amp; Collaborate.</li><li><strong>&#39;Transparency&#39; dropped</strong>: In the profile he says he removed transparency from the core values because people used it as cover for attacks, replacing it with resiliency.</li><li><strong>Transparency on the site today</strong>: The current Who We Are page lists Transparency again, beside Empowerment and Meritocracy; I found no source explaining the change.</li><li><strong>Friendly, not friends</strong>: Citing a peer&#39;s &#39;rotten strawberry&#39; idea, he says he now keeps a professional distance from staff and sees removing bad apples as important, having earlier tried to work through problems instead.</li><li><strong>Redesign, don&#39;t add AI</strong>: His headline argument: companies are buying copilots and running pilots but leaving workflows intact, and should instead redesign workflow, jobs, teams, product, stack, governance and measurement.</li><li><strong>The AI-native enterprise</strong>: A twelve-point checklist that moves from copilots to agents, treats context as infrastructure and calls AI-native an operating-model change rather than a technology one.</li><li><strong>Stop buying AI seats</strong>: He argues per-employee AI licences rarely change how a business operates, and that AI should be built into the work so it becomes invisible.</li><li><strong>Build vs buy, reopened</strong>: Because AI lowers the cost of custom software, he says enterprises should weigh building the workflows that differentiate them instead of defaulting to SaaS.</li><li><strong>Governed autonomy</strong>: Agents that act inside enterprise systems need identity, permissions, audit and approval designed in from the start, not added after a pilot works.</li><li><strong>Measure leverage, not activity</strong>: If agents do the repetitive work, he says the useful question about an employee changes from what they did to what they built that keeps producing results.</li><li><strong>Be your own AI case study</strong>: Point twelve of his list: a firm that sells AI advice should run its own operations on AI first. TribalScale&#39;s site lists an internal enterprise agentic platform among its cases.</li><li><strong>FinScale Magazine</strong>: A free digital magazine for financial-services and insurance leaders, launched in May 2025, where several of his later pieces first appeared.</li><li><strong>The deployment gap</strong>: He argues the coming failures in financial-services AI will be agent projects that reach production and then fail silently, which old monitoring does not catch.</li><li><strong>The insurance AI gap</strong>: An essay opening with an unnamed insurer executive&#39;s complaint that most of her firm&#39;s AI initiatives are not in production, then arguing insurance lags banking.</li><li><strong>Feed Ontario and SickKids</strong>: His company profile lists a board seat at Feed Ontario and membership of the Tech4SickKids Council.</li><li><strong>DMZ and Techstars</strong>: The same profile lists him as a DMZ member and a Techstars mentor, tying him to Toronto&#39;s startup support ecosystem.</li><li><strong>Harvard OPM program</strong>: A Harvard Business School programme for owner-presidents, which he discusses on the company podcast and which a magazine profile says he was enrolled in.</li><li><strong>First Name Basis podcast</strong>: TribalScale&#39;s own interview podcast; in episode 64 a marketing coordinator interviews him about learning and working in teams.</li><li><strong>Outside interviews</strong>: Third-party podcasts and shows from 2018 to 2025, on innovation, digital transformation and building a services business.</li><li><strong>&#39;Top 10 Leading Men&#39; (MSN)</strong>: TribalScale&#39;s press release says an MSN global profile named him one of ten leading men of 2025; I could not find the MSN piece itself.</li></ul></noscript>

<script type="application/json" id="story-data">{"schemaVersion":1,"title":"Sheetal Jaitly","subject":{"name":"Sheetal Jaitly","kind":"person","url":"https://www.tribalscale.com/in-focus/sheetal-jaitly"},"tagline":"A map of a sales-trained founder who built, nearly lost and rebuilt a software consultancy, and who now tells enterprises to redesign themselves around AI rather than bolt it on.","root":"sheetal","credit":"An independent StoryTellr study by Nikhil Khedkar.","disclaimer":"Built only from Sheetal Jaitly's publicly published professional record: his writing, interviews, press coverage and company pages. Personal and family details in those sources are deliberately left out. Not affiliated with or endorsed by Sheetal Jaitly or TribalScale.","generated":{"date":"2026-09-30"},"clusters":[{"id":"path","label":"Path into tech"},{"id":"build","label":"Building TribalScale"},{"id":"reset","label":"Crisis and reset"},{"id":"values","label":"How he says he leads"},{"id":"ideas","label":"The AI-native argument"},{"id":"voice","label":"Roles and voice"}],"sources":[{"id":"tsfocus","title":"Sheetal Jaitly (In Focus)","url":"https://www.tribalscale.com/in-focus/sheetal-jaitly","accessed":"2026-09-30","publisher":"TribalScale"},{"id":"dontadd","title":"Don't Add AI. Redesign the Company.","url":"https://www.tribalscale.com/insights/dont-add-ai-redesign-the-company","accessed":"2026-09-30","publisher":"TribalScale (by Sheetal Jaitly)"},{"id":"ainative","title":"The AI-Native Enterprise: 12 Things You Must Do to Transform Your Company","url":"https://www.tribalscale.com/insights/ai-native-enterprise-12-things","accessed":"2026-09-30","publisher":"TribalScale (by Sheetal Jaitly)"},{"id":"seats","title":"Stop Buying AI Seats. Start Rebuilding How Work Gets Done","url":"https://www.tribalscale.com/insights/stop-buying-ai-seats","accessed":"2026-09-30","publisher":"TribalScale (by Sheetal Jaitly)"},{"id":"deploygap","title":"The Deployment Gap, Now in the Agentic Era (intro only)","url":"https://www.tribalscale.com/insights/the-deployment-gap-now-in-the-agentic-era","accessed":"2026-09-30","publisher":"TribalScale (by Sheetal Jaitly)"},{"id":"insgap","title":"The Insurance AI Gap, Now an Agent-Era Catch-Up Race (intro only)","url":"https://www.tribalscale.com/insights/the-insurance-ai-gap-now-an-agent-era-catch-up-race","accessed":"2026-09-30","publisher":"TribalScale (by Sheetal Jaitly)"},{"id":"swagger","title":"SWAGGERMAGAZINE: SELFMADE, Sheetal Jaitly (undated)","url":"https://www.swaggermagazine.com/home/selfmade/SheetalJaitly/","accessed":"2026-09-30","publisher":"Swagger Publications"},{"id":"medium20","title":"TribalScale 2.0: Restructuring & Resilience","url":"https://medium.com/tribalscale/tribalscale-2-0-restructuring-resilience-66b957484e87","accessed":"2026-09-30","publisher":"TribalScale on Medium (Feb 25, 2021)"},{"id":"takeoverstory","title":"The TakeOver Story","url":"https://medium.com/tribalscale/the-takeover-story-196ba3cc2998","accessed":"2026-09-30","publisher":"TribalScale on Medium (Sep 26, 2017)"},{"id":"tribe2","title":"Tribe Turns 2!","url":"https://medium.com/tribalscale/tribe-turns-2-8109fe06a7c6","accessed":"2026-09-30","publisher":"TribalScale on Medium (Nov 2, 2017)"},{"id":"bkinsolv","title":"With $5.8 million owed to creditors, TribalScale files for insolvency in bid to restructure company","url":"https://betakit.com/with-5-8-million-owed-to-creditors-tribalscale-files-for-insolvency-in-bid-to-restructure-company/","accessed":"2026-09-30","publisher":"BetaKit (Jun 16, 2020)"},{"id":"bwexit","title":"TribalScale Exits Creditor Protection","url":"https://www.businesswire.com/news/home/20210222005241/en/TribalScale-Exits-Creditor-Protection","accessed":"2026-09-30","publisher":"Business Wire (Feb 22, 2021)"},{"id":"bkvs","title":"TribalScale launches $100 million Venture Studios program to co-create AI and blockchain startups","url":"https://betakit.com/tribalscale-launches-100-million-venture-studios-program-to-co-create-ai-and-blockchain-startups/","accessed":"2026-09-30","publisher":"BetaKit (Feb 7, 2018)"},{"id":"globexl","title":"California firm buys Toronto mobile developer Xtreme Labs","url":"https://www.theglobeandmail.com/technology/california-firm-buys-toronto-mobile-developer-xtreme-labs/article14664751/","accessed":"2026-09-30","publisher":"The Globe and Mail (Oct 2, 2013)"},{"id":"who","title":"Who We Are","url":"https://www.tribalscale.com/company/who-we-are","accessed":"2026-09-30","publisher":"TribalScale"},{"id":"how","title":"How We Work","url":"https://www.tribalscale.com/company/how-we-work","accessed":"2026-09-30","publisher":"TribalScale"},{"id":"vsite","title":"Tribal Venture Studio","url":"https://www.tribalscale.com/company/venture-studio","accessed":"2026-09-30","publisher":"TribalScale"},{"id":"finpr","title":"FinScale Magazine Launches to Guide the Future of Financial Services and Insurance","url":"https://www.tribalscale.com/press-release/tribalscale-launches-finscale-magazine-issue-01","accessed":"2026-09-30","publisher":"TribalScale (May 5, 2025)"},{"id":"top10","title":"TribalScale CEO Sheetal Jaitly Named One of the Top 10 Leading Men in 2025 in MSN","url":"https://www.tribalscale.com/press-release/tribalscale-ceo-sheetal-jaitly-named-one-of-the-top-10-leading-men-in-2025","accessed":"2026-09-30","publisher":"TribalScale (Dec 3, 2025)"},{"id":"fnb","title":"Always Be Learning with Sheetal Jaitly from TribalScale (First Name Basis, Ep. 64)","url":"https://www.tribalscale.com/podcast/always-be-learning","accessed":"2026-09-30","publisher":"TribalScale"},{"id":"hardpart","title":"Sheetal Jaitly from TribalScale (The Hard Part with Evan McCann)","url":"https://podcasts.apple.com/nz/podcast/sheetal-jaitly-from-tribalscale/id1634787423?i=1000703046792","accessed":"2026-09-30","publisher":"Apple Podcasts (Apr 10, 2025)"},{"id":"ms","title":"Innovating the Foundations of Industry 4.0 with Sheetal Jaitly","url":"https://marketscale.com/industries/podcast-network/wavelengths/innovating-the-foundations-of-industry-4-0-with-sheetal-jaitly/","accessed":"2026-09-30","publisher":"MarketScale (Nov 3, 2022)"},{"id":"oc","title":"Sheetal Jaitly, Founder and CEO of TribalScale (Open Concept)","url":"https://www.listennotes.com/podcasts/open-concept/sheetal-jaitly-founder-and-IBepTvmbjaD/","accessed":"2026-09-30","publisher":"Listen Notes"},{"id":"tblp","title":"TBLP044 | Sheetal Jaitly: Start With An Entrepreneurial Mindset","url":"https://edwin100x.substack.com/p/tblp044-sheetal-jaitly-start-with-dd7","accessed":"2026-09-30","publisher":"The Business Leadership Podcast (Jan 23, 2018)"}],"nodes":[{"id":"sheetal","title":"Sheetal Jaitly","type":"person","cluster":"build","featured":true,"summary":"Founder and CEO of TribalScale, a Toronto-based software and AI consultancy, and the author of a run of 2026 essays on becoming AI-native.","evidence":"Founder and Chief Executive Officer @ TribalScale","sources":["tsfocus"]},{"id":"keating","title":"Shipping desk at Keating","type":"job","cluster":"path","summary":"His first tech job, per a magazine profile, was in shipping and receiving at Keating Technologies, where he watched a company scale fast.","details":"The profile is undated, and the period is not given. Nothing earlier in his career could be confirmed from pages I read.","evidence":"I saw what rapid growth from 30 to 300 people looked like.","sources":["swagger"]},{"id":"ricoh","title":"Copiers, then analytics sales","type":"job","cluster":"path","summary":"He learned to sell at Ricoh and was then recruited by a customer to sell predictive analytics, a product clients did not yet know they wanted.","details":"The profile places this in the mid 2000s and says he was a director-level employee at 27 before joining Xtreme Labs. An Open Concept blurb separately mentions his time as a door-to-door photocopier salesman.","evidence":"landed at Ricoh as a copy machine salesman","sources":["swagger","oc"]},{"id":"xtreme","title":"Xtreme Labs","type":"company","cluster":"path","featured":true,"summary":"A Toronto mobile-app shop where he joined friends at its launch and, per the profile, helped grow revenue to $37.5m in five years.","details":"The Globe and Mail describes Xtreme Labs as founded in 2007 by Amar Varma and Sundeep Madra with 350 staff in 2013; it does not mention Jaitly. His role and the $37.5m figure rest on the magazine profile alone. A 2025 podcast lists 'Xtreme Labs Experience and Mafia' among its topics.","evidence":"helped grow the business to $37.5m in revenue in five years","when":"2007 founding; acquired 2013","sources":["swagger","globexl","hardpart"]},{"id":"pivotal","title":"Pivotal buys Xtreme Labs","type":"event","cluster":"path","summary":"In October 2013 Pivotal bought Xtreme Labs; the profile says the company later passed to Dell, and that he struggled to find his place in the larger organisation.","details":"The Globe reports the price was undisclosed and cites All Things Digital for $65 million (US). The Dell step is stated only in the profile.","evidence":"Xtreme Labs was acquired by Pivotal, and then by Dell","when":"Oct 2, 2013","sources":["globexl","swagger"]},{"id":"founding","title":"TribalScale is founded","type":"event","cluster":"build","featured":true,"summary":"He started the company in November 2015, saying he saw a gap in how organisations deliver digital products in an Agile way.","details":"In the same profile he says that in a big organisation he felt like one person at a desk in a big machine, which he gives as a reason for leaving.","evidence":"I first started TS because I saw there was a big gap in the market.","when":"November 2015","sources":["medium20","swagger"]},{"id":"first-client","title":"The $1.2m first client","type":"episode","cluster":"build","summary":"In his telling, a media-company buyer he had advised at Pivotal cut his pitch short and signed a $1.2m contract because he had once talked that buyer out of a bigger purchase.","details":"The client is unnamed and the account is single-sourced to the magazine profile, so treat the figure as his account.","evidence":"you rejected the opportunity for a huge commission just to do what was right by me.","sources":["swagger"]},{"id":"growth","title":"0 to 100 in two years","type":"milestone","cluster":"build","summary":"By the second anniversary TribalScale reported 100+ employees and offices in Toronto, California and Dubai, the first stretch of fast growth.","details":"TribalScale's own count at two years: over 125 members globally; a Dubai team of 14; new Toronto HQ at 200 Wellington St W. These are company statements.","evidence":"In less than two years, we went from 0 to 100 employees.","when":"Nov 2017","sources":["tribe2"]},{"id":"takeover","title":"TakeOver conference","type":"event","cluster":"build","featured":true,"summary":"A conference he started because he wanted a less cookie-cutter tech event in Toronto; it grew from 800 attendees in 2017 to a sold-out 1,700 in 2018.","details":"TribalScale says 83 speakers in 2017 (52% women) and that Prime Minister Justin Trudeau opened the 2018 event, which raised money for SickKids. BetaKit later reports a 2019 edition was cancelled, leaving a hotel claim in the insolvency filings.","evidence":"We did our first TakeOver in 2017 with over 800 attendees.","when":"Oct 2017; 2018","sources":["medium20","takeoverstory","tribe2","bkinsolv"]},{"id":"venture-studios","title":"Venture Studios","type":"initiative","cluster":"build","summary":"A startup-creation arm announced in 2018 with a $100 million target, offering $500,000 in cash and support to accepted startups in blockchain, AI and voice.","details":"Launched with chief innovation officer Roger Chabra; Kirstine Stewart joined as president and chief revenue officer around the announcement (BetaKit). TribalScale's site today still runs a Venture Studio and says 'Most venture studios advise. We build.'","evidence":"create startups in the blockchain, AI, and voice space over the next five years","when":"Announced Feb 7, 2018","sources":["bkvs","tribe2","vsite"]},{"id":"voice-ai","title":"Voice and Alexa skills","type":"capability","cluster":"build","summary":"An early bet on voice interfaces: TribalScale said in 2017 that Amazon and Google recognised it as an expert builder for their voice platforms.","details":"This is TribalScale's own claim; I found no Amazon or Google statement. The 2017 TakeOver programme also listed Voice among its topics.","evidence":"Being recognized by Amazon and Google as expert Alexa skill and Action builders for their voice platforms","when":"2017","sources":["tribe2","takeoverstory"]},{"id":"client-loss","title":"A large client leaves (2019)","type":"event","cluster":"reset","featured":true,"summary":"He dates the trouble to a large client restructuring and ending its engagement, leaving an oversized team; revenue concentrated in two clients.","details":"BetaKit adds that, per Jaitly, a second client also hired away staff, and that debts began to build in early 2019. These are his explanations; the clients are not named.","evidence":"We had a large client restructure their company and exit our engagement and we struggled to maintain our large staff capacity.","when":"2019","sources":["medium20","bkinsolv"]},{"id":"noi","title":"Insolvency filing, May 2020","type":"event","cluster":"reset","featured":true,"summary":"Independent trade press reported TribalScale filing a notice of intention under Canada's Bankruptcy and Insolvency Act, a formal route to restructure rather than go bankrupt.","details":"BetaKit, working from public filings, says the filing was May 19 and that the company's lawyer described a landlord's lease-default claim as the trigger. Jaitly told BetaKit the filing belonged to a restructuring plan begun over a year earlier. His own 2021 essay describes the landlord disagreement as what brought the company into CCAA protection.","evidence":"TribalScale owes more than $5.8 million to 45 creditors","when":"May 19, 2020","sources":["bkinsolv","medium20"]},{"id":"pandemic","title":"Pandemic shock, 2020","type":"event","cluster":"reset","summary":"The profile says the company lost most of its customers in early 2020 and he chose to keep serving clients at no charge; the Toronto office closed on March 16.","details":"The 80% figure and the free reinvestment are the magazine's wording of what he said, not independently checked. BetaKit separately says the pandemic accelerated the filing timeline and ended a possible sale of the company (his claim).","evidence":"The first months of 2020 saw TribalScale lose 80 percent of their customers.","when":"2020","sources":["swagger","medium20","bkinsolv"]},{"id":"exit","title":"Out of creditor protection","type":"event","cluster":"reset","featured":true,"summary":"The company says it exited its restructuring proceeding under Canada's CCAA on January 27, 2021 and describes itself as leaner and healthier.","details":"The press release and his essay are the company's account; the terms of the restructuring were not read. The release also says the company 'closed over $81 million of funding in five years' (company claim, unclear what is counted).","evidence":"TribalScale emerged from creditor protection on January 27, 2021.","when":"Jan 27, 2021","sources":["bwexit","medium20"]},{"id":"ts2","title":"The 'TribalScale 2.0' essay","type":"text","cluster":"reset","summary":"His own account of the reset: what went wrong, how the team shut the office, and why he calls the rebuilt company more sustainable.","details":"Written by Jaitly as CEO and published on the company's Medium page; it frames the episode around resilience and ends with a pitch to clients.","evidence":"Clawing our way out of creditor protection was the greatest and most difficult feat our company has ever faced.","when":"Feb 25, 2021","sources":["medium20"]},{"id":"accounts","title":"Three sets of growth figures","type":"open-question","cluster":"reset","summary":"Sources give different numbers for the boom years, and none is independently verified, so this map does not pick one.","details":"Profile: 'just over $50m in revenue', 250+ staff, seven offices in three years. BetaKit quoting Jaitly: $60 million over three years, $30 million in 2018. Company press release: 'over $81 million of funding in five years'. Headcount also appears as 125+ (Nov 2017) and about 60 (June 2020).","evidence":"In three years, TribalScale earned just over $50m in revenue, grew the staff to 250+","sources":["swagger","bkinsolv","bwexit","tribe2"]},{"id":"fail-fast","title":"Fail Fast","type":"value","cluster":"values","summary":"A motto he hands out on stickers; he frames setbacks as something to learn from quickly, and used it again to describe the 2020 recovery.","evidence":"Sheetal Jaitly gives his employees stickers that say “Fail Fast”.","sources":["swagger","medium20"]},{"id":"do-right","title":"Do right by the client","type":"principle","cluster":"values","featured":true,"summary":"A recurring claim in his own accounts: advising clients against a bigger sale, and later serving them free when revenue collapsed, pays back over time.","details":"Both episodes are told by Jaitly via the magazine profile; neither was independently confirmed.","evidence":"doing what’s right comes back to you exponentially when you develop the right bonds","sources":["swagger"]},{"id":"values-2021","title":"Core values after the reset","type":"value","cluster":"values","summary":"After exiting creditor protection he set out the company's values as Resilience, Empowerment, and Challenge & Collaborate.","evidence":"Our next step was to define our Core Values.","when":"2021","sources":["medium20"]},{"id":"transp-dropped","title":"'Transparency' dropped","type":"decision","cluster":"values","summary":"In the profile he says he removed transparency from the core values because people used it as cover for attacks, replacing it with resiliency.","details":"He adds the company is 'still transparent'; he objected to the word as a value, not to openness. The profile is undated.","evidence":"The term was used to attack people.","sources":["swagger"]},{"id":"transp-today","title":"Transparency on the site today","type":"observation","cluster":"values","summary":"The current Who We Are page lists Transparency again, beside Empowerment and Meritocracy; I found no source explaining the change.","details":"The two sources are undated or differently dated, so this records a difference in wording, not a reversal or its cause. The page footer reads 2025.","evidence":"Built on Empowerment, Meritocracy, Transparency","sources":["who"]},{"id":"strawberry","title":"Friendly, not friends","type":"principle","cluster":"values","summary":"Citing a peer's 'rotten strawberry' idea, he says he now keeps a professional distance from staff and sees removing bad apples as important, having earlier tried to work through problems instead.","evidence":"I have to be friendly – not friends – with my employees.","sources":["swagger"]},{"id":"dont-add-ai","title":"Redesign, don't add AI","type":"essay","cluster":"ideas","featured":true,"summary":"His headline argument: companies are buying copilots and running pilots but leaving workflows intact, and should instead redesign workflow, jobs, teams, product, stack, governance and measurement.","evidence":"Most companies are adding 2026 AI to 2016 workflows.","when":"2026 (undated on page)","sources":["dontadd"]},{"id":"ai-native","title":"The AI-native enterprise","type":"essay","cluster":"ideas","featured":true,"summary":"A twelve-point checklist that moves from copilots to agents, treats context as infrastructure and calls AI-native an operating-model change rather than a technology one.","evidence":"Copilots help people perform tasks. Agents perform work.","when":"2026 (undated on page)","sources":["ainative"]},{"id":"seats","title":"Stop buying AI seats","type":"essay","cluster":"ideas","summary":"He argues per-employee AI licences rarely change how a business operates, and that AI should be built into the work so it becomes invisible.","evidence":"Buying everyone an AI seat is not AI transformation.","when":"2026 (undated on page)","sources":["seats"]},{"id":"build-buy","title":"Build vs buy, reopened","type":"claim","cluster":"ideas","summary":"Because AI lowers the cost of custom software, he says enterprises should weigh building the workflows that differentiate them instead of defaulting to SaaS.","details":"He still says to buy standardised commodity capabilities; the essay includes a buy/build comparison table.","evidence":"This is why I am increasingly bullish on building custom software again.","sources":["seats"]},{"id":"governed","title":"Governed autonomy","type":"claim","cluster":"ideas","summary":"Agents that act inside enterprise systems need identity, permissions, audit and approval designed in from the start, not added after a pilot works.","evidence":"Governance therefore has to move into the architecture.","sources":["dontadd","ainative"]},{"id":"leverage","title":"Measure leverage, not activity","type":"claim","cluster":"ideas","summary":"If agents do the repetitive work, he says the useful question about an employee changes from what they did to what they built that keeps producing results.","evidence":"Companies should begin measuring leverage—not activity.","sources":["ainative","dontadd"]},{"id":"own-case","title":"Be your own AI case study","type":"claim","cluster":"ideas","summary":"Point twelve of his list: a firm that sells AI advice should run its own operations on AI first. TribalScale's site lists an internal enterprise agentic platform among its cases.","details":"The How We Work page lists a case titled 'Building an Enterprise Agentic Platform for Delivery, Operations, and Personal Productivity'; I read only the title, not the case.","evidence":"Use AI internally. Aggressively.","sources":["ainative","how"]},{"id":"finscale","title":"FinScale Magazine","type":"publication","cluster":"ideas","summary":"A free digital magazine for financial-services and insurance leaders, launched in May 2025, where several of his later pieces first appeared.","evidence":"AI, data, and digital transformation are no longer future-focused buzzwords","when":"May 5, 2025","sources":["finpr","deploygap"]},{"id":"deploy-gap","title":"The deployment gap","type":"essay","cluster":"ideas","summary":"He argues the coming failures in financial-services AI will be agent projects that reach production and then fail silently, which old monitoring does not catch.","details":"Only the introduction is public; the rest is gated behind a FinScale download. It cites a VentureBeat analysis from April 2026 that I did not read.","evidence":"is the service behaving correctly?","when":"2026","sources":["deploygap"]},{"id":"ins-gap","title":"The insurance AI gap","type":"essay","cluster":"ideas","summary":"An essay opening with an unnamed insurer executive's complaint that most of her firm's AI initiatives are not in production, then arguing insurance lags banking.","details":"The statistics (McKinsey 2024, Deloitte, Accenture) are quoted by him from third parties and were not checked. Only the introduction is public.","evidence":"fewer than 10 percent of P&C and life insurers have deployed AI at scale","when":"2026","sources":["insgap"]},{"id":"boards","title":"Feed Ontario and SickKids","type":"role","cluster":"voice","summary":"His company profile lists a board seat at Feed Ontario and membership of the Tech4SickKids Council.","details":"Self-described and undated; I found no independent listing of either role or their dates. Separately, TakeOver 2018 raised money for SickKids.","evidence":"Sheetal is a board member of Feed Ontario, a member of Tech4SickKids Council","sources":["tsfocus","medium20"]},{"id":"mentor","title":"DMZ and Techstars","type":"role","cluster":"voice","summary":"The same profile lists him as a DMZ member and a Techstars mentor, tying him to Toronto's startup support ecosystem.","details":"Self-described and undated; not independently confirmed.","evidence":"DMZ, and a TechStars Mentor","sources":["tsfocus"]},{"id":"hbs","title":"Harvard OPM program","type":"education","cluster":"voice","summary":"A Harvard Business School programme for owner-presidents, which he discusses on the company podcast and which a magazine profile says he was enrolled in.","details":"Enrolment dates and completion are not stated in the sources I read.","evidence":"the Owner/President Management Program at Harvard Business School","sources":["fnb","swagger"]},{"id":"fnb","title":"First Name Basis podcast","type":"podcast","cluster":"voice","summary":"TribalScale's own interview podcast; in episode 64 a marketing coordinator interviews him about learning and working in teams.","evidence":"Episode 64, 27 min","sources":["fnb"]},{"id":"interviews","title":"Outside interviews","type":"press","cluster":"voice","summary":"Third-party podcasts and shows from 2018 to 2025, on innovation, digital transformation and building a services business.","details":"Read as show notes only: The Business Leadership Podcast (Jan 2018), Open Concept (undated), MarketScale on Industry 4.0 (Nov 2022), The Hard Part with Evan McCann (Apr 2025).","evidence":"The things that we thought were impossible are now being shown to us that they can be possible.","when":"2018-2025","sources":["tblp","oc","ms","hardpart"]},{"id":"top10","title":"'Top 10 Leading Men' (MSN)","type":"recognition","cluster":"voice","summary":"TribalScale's press release says an MSN global profile named him one of ten leading men of 2025; I could not find the MSN piece itself.","details":"Treat as a company claim; the feature may be sponsored or syndicated.","evidence":"named one of the Top 10 Leading Men in 2025 in MSN","when":"Oct-Dec 2025","sources":["top10"]}],"edges":[{"source":"sheetal","target":"keating","label":"started <script>
(() => {
"use strict";
const story = JSON.parse(document.getElementById("story-data").textContent);
const theme = JSON.parse(document.getElementById("theme-data").textContent);
const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isNarrow = () => innerWidth <= 760;

/* ---------- tiny DOM helpers (all text goes through textContent: no HTML injection) ---------- */
function el(tag, props, ...kids) {

}

}
const safeUrl = (u) => { try { return /^https?:$/.test(new URL(u).protocol) ? u : null; } catch { return null; } };
const cap = (s) => String(s || "").replace(/[-_]/g, " ").replace(/^./, (c) => c.toUpperCase());

/* ---------- theme ---------- */
const hex2rgb = (h) => { h = h.replace("#", ""); if (h.length === 3) h = [...h].map((x) => x + x).join(""); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); };

  return [h, s, l];
}
const nClusters = story.clusters.length;
const cIndex = new Map(story.clusters.map((c, i) => [c.id, i]));
function clusterColor(id) {
  if (theme.clusters && theme.clusters[id]) return theme.clusters[id];
  const [h, s] = rgb2hsl(hex2rgb(theme.colors.accent));
  const hue = (h + cIndex.get(id) * (360 / nClusters)) % 360;
  return `hsl(${hue.toFixed(0)} ${Math.max(45, Math.min(75, s * 100)).toFixed(0)}% ${theme.mode === "dark" ? 66 : 40}%)`;
}
const colors = Object.fromEntries(story.clusters.map((c) => [c.id, clusterColor(c.id)]));
if (theme.font) {
  if (theme.font.body) document.body.style.fontFamily = theme.font.body;
  if (theme.font.display) $("wordmark").style.fontFamily = theme.font.display;
}
const wm = theme.wordmark || {};
$("wordmark").textContent = wm.text || story.title;
if (wm.letterSpacing) $("wordmark").style.letterSpacing = wm.letterSpacing;
if (wm.uppercase) $("wordmark").style.textTransform = "uppercase";
if (theme.logo && theme.logo.src) $("logo").append(el("img", { src: theme.logo.src, alt: theme.logo.alt || "" }));
$("dek").textContent = story.tagline;
$("credit").textContent = [story.disclaimer, story.credit].filter(Boolean).join(" ");

/* ---------- model ---------- */
const nodes = story.nodes.map((n) => ({ ...n, x: 0, y: 0, vx: 0, vy: 0, deg: 0, color: colors[n.cluster], isRoot: n.id === story.root }));
const byId = new Map(nodes.map((n) => [n.id, n]));
const edges = story.edges.map((e, i) => ({ ...e, i, a: byId.get(e.source), b: byId.get(e.target) }));
const adj = new Map(nodes.map((n) => [n.id, new Set()]));
for (const e of edges) { e.a.deg++; e.b.deg++; adj.get(e.source).add(e.target); adj.get(e.target).add(e.source); }
for (const n of nodes) n.r = n.isRoot ? 30 : (n.featured ? 13 : 8) + Math.min(n.deg, 8) * 0.45;
const srcById = new Map(story.sources.map((s) => [s.id, s]));
const storyById = new Map((story.stories || []).map((s) => [s.id, s]));

/* ---------- force layout (deterministic, no dependencies) ---------- */
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  const R = 330 + Math.sqrt(N) * 40;
  const asp = Math.max(0.75, Math.min(2.2, svgEl.clientWidth / Math.max(1, svgEl.clientHeight))), ax = Math.sqrt(asp), ay = 1 / ax; // fill the stage shape
  for (const n of nodes) {
    n.vx = n.vy = 0;
    if (n.isRoot) { n.x = n.y = 0; continue; }
    const ang = sector(n.cluster) + (rnd() - 0.5) * 0.9, rad = R * (0.45 + rnd() * 0.7);
    n.x = Math.cos(ang) * rad * ax; n.y = Math.sin(ang) * rad * ay;
  }
  const iters = N > 140 ? 220 : 480, XS = 0.55; // XS<1 makes horizontal crowding count more: labels are wider than tall
  for (let it = 0; it < iters; it++) {
    const alpha = Math.pow(1 - it / iters, 1.4);
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      if (dx * dx + dy * dy < 1) { dx = rnd() - .5; dy = rnd() - .5; }
      const wd = Math.sqrt(dx * dx * XS * XS + dy * dy) || 1, d = Math.sqrt(dx * dx + dy * dy) || 1;
      const min = a.r + b.r + 95;
      let f = 26000 / (wd * wd); if (wd < min) f += (min - wd) * 0.9;
      f *= alpha + 0.04;
      const fx = dx / d * f, fy = dy / d * f;
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
    }
    for (const e of edges) {
      const a = e.a, b = e.b, dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
      const L = a.cluster === b.cluster ? 150 : 250, f = (d - L) * 0.03 * (alpha + 0.1);
      const fx = dx / d * f, fy = dy / d * f; a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
    for (const n of nodes) {
      if (n.isRoot) continue;
      const s = sector(n.cluster), tx = Math.cos(s) * R * ax, ty = Math.sin(s) * R * ay;
      n.vx += (tx - n.x) * 0.014 * alpha; n.vy += (ty - n.y) * 0.014 * alpha;
      n.x += n.vx * 0.6; n.y += n.vy * 0.6; n.vx *= 0.55; n.vy *= 0.55;
    }
  }
}

/* ---------- SVG build ---------- */
const svgEl = $("graph"), vp = $("vp");
for (const e of edges) {
  e.line = sv("line", { class: "edge" + (e.kind === "inferred" ? " inferred" : "") });
  e.line.append(Object.assign(sv("title"), { textContent: `${e.a.title} → ${e.b.title}: ${e.label} (${e.kind})` }));
  e.text = sv("text", { class: "edge-label" }); e.text.textContent = e.label;
  $("edges").append(e.line); $("edge-labels").append(e.text);
}
for (const n of nodes) {
  const g = sv("g", { class: "node" + (n.isRoot ? " root" : ""), tabindex: 0, role: "button", "aria-label": `${n.title}, ${cap(n.type)}, ${story.clusters[cIndex.get(n.cluster)].label}`, "data-id": n.id });
  g.append(sv("circle", { r: n.r + 11, fill: "transparent" }));
  g.append(sv("circle", { class: "ring", r: n.r + 6 }));
  g.append(sv("circle", { class: "core", r: n.r, stroke: n.color, style: n.isRoot ? "fill:" + n.color : null }));
  if (!n.isRoot) g.append(sv("circle", { class: "dot", r: Math.max(2, n.r * 0.22), fill: n.color }));
  const lab = sv("text", { class: "label", y: n.r + 15 }); lab.textContent = n.title; g.append(lab);
  if (!n.isRoot) { const k = sv("text", { class: "kind", y: n.r + 26 }); k.textContent = cap(n.type); g.append(k); }
  g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n.id, { center: true }); } });
  n.g = g; $("nodes").append(g);
}
function place() {
  for (const e of edges) {
    e.line.setAttribute("x1", e.a.x); e.line.setAttribute("y1", e.a.y); e.line.setAttribute("x2", e.b.x); e.line.setAttribute("y2", e.b.y);
    e.text.setAttribute("x", (e.a.x + e.b.x) / 2); e.text.setAttribute("y", (e.a.y + e.b.y) / 2 - 4);
  }
  for (const n of nodes) n.g.setAttribute("transform", `translate(${n.x.toFixed(1)} ${n.y.toFixed(1)})`);
  drawStoryPath();
}

/* ---------- view (pan / zoom) ---------- */
const view = { x: 0, y: 0, k: 1 };
function applyView() { svgEl.style.setProperty("--ls", Math.min(2.2, Math.max(1, 0.95 / view.k)).toFixed(2)); vp.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`); svgEl.classList.toggle("zoomed", view.k >= 1.15); }
let tweenId = 0;
function tween(to, ms = 480) {
  cancelAnimationFrame(tweenId);
  if (reduceMotion) { Object.assign(view, to); applyView(); return; }
  const from = { ...view }, t0 = performance.now();

    const p = Math.min(1, (t - t0) / ms), q = 1 - Math.pow(1 - p, 3);
    view.x = from.x + (to.x - from.x) * q; view.y = from.y + (to.y - from.y) * q; view.k = from.k + (to.k - from.k) * q; applyView();

  };

}
const stageBox = () => {
  const W = svgEl.clientWidth, H = svgEl.clientHeight;
  const panelOpen = $("panel").classList.contains("open");
  return { W, H, left: 0, right: panelOpen && !isNarrow() ? Math.min(400, W) : 0, bottom: panelOpen && isNarrow() ? H * 0.58 : 0 };
};
function fit(animate = true, list = nodes) {
  const { W, H, right, bottom } = stageBox();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const n of list) { x0 = Math.min(x0, n.x - n.r - 60); x1 = Math.max(x1, n.x + n.r + 60); y0 = Math.min(y0, n.y - n.r - 30); y1 = Math.max(y1, n.y + n.r + 50); }

  const k = Math.max(0.2, Math.min(1.6, Math.min(aw / (x1 - x0), ah / (y1 - y0))));
  const to = { k, x: aw / 2 - (x0 + x1) / 2 * k, y: (ah + 0) / 2 - (y0 + y1) / 2 * k + 6 };

}

  tween({ k, x: (W - right) / 2 - n.x * k, y: (H - bottom) / 2 - n.y * k - 10 }, 420);
}
function zoomAt(f, cx, cy) {
  const k = Math.max(0.2, Math.min(4, view.k * f)), r = k / view.k;
  view.x = cx - (cx - view.x) * r; view.y = cy - (cy - view.y) * r; view.k = k; applyView();
}

/* ---------- state + render ---------- */
const S = { selected: null, filter: "all", q: "", list: false, story: null, step: 0 };
const matches = (n) => {
  if (S.filter !== "all" && n.cluster !== S.filter) return false;
  if (!S.q) return true;
  return [n.title, n.summary, n.details, n.type, (n.themes || []).join(" ")].join(" ").toLowerCase().includes(S.q);
};
function render() {
  const sel = S.selected && byId.get(S.selected), nb = sel ? adj.get(sel.id) : null;
  const inStory = S.story ? new Set(S.story.steps) : null;
  let shown = 0;
  for (const n of nodes) {
    const m = matches(n); if (m) shown++;
    let dim = !m;
    if (inStory) dim = dim || !inStory.has(n.id);
    else if (sel && n !== sel && !nb.has(n.id)) dim = true;
    n.g.classList.toggle("dim", dim);
    n.g.classList.toggle("sel", n === sel);
    n.g.setAttribute("aria-pressed", String(n === sel));
  }
  for (const e of edges) {
    const hl = !inStory && sel && (e.a === sel || e.b === sel);
    e.line.classList.toggle("hl", !!hl); e.text.classList.toggle("hl", !!hl);
    let dim = !(matches(e.a) && matches(e.b));
    if (inStory) dim = true; else if (sel && !hl) dim = true;
    e.line.classList.toggle("dim", dim);
  }

  $("status").textContent = `${nodes.length} nodes · ${edges.length} edges · ${S.q || S.filter !== "all" ? `${shown} match · ` : ""}Click a node to explore the story.`;
  for (const b of $("chips").children) b.setAttribute("aria-pressed", String(b.dataset.c === S.filter));
  for (const b of $("stories").querySelectorAll("button")) b.setAttribute("aria-pressed", String(!!S.story && b.dataset.s === S.story.id));
  if (S.list) renderList();

}

/* ---------- story mode ---------- */
function drawStoryPath() {
  const p = $("story-path"), bg = $("badges"); bg.textContent = "";
  if (!S.story) { p.setAttribute("d", ""); return; }
  const pts = S.story.steps.map((id) => byId.get(id));
  p.setAttribute("d", pts.map((n, i) => `${i ? "L" : "M"}${n.x.toFixed(1)} ${n.y.toFixed(1)}`).join(" "));
  pts.forEach((n, i) => {
    const g = sv("g", { class: "badge", transform: `translate(${(n.x + n.r * 0.8).toFixed(1)} ${(n.y - n.r * 0.8).toFixed(1)})`, opacity: i === S.step ? 1 : 0.75 });
    g.append(sv("circle", { r: i === S.step ? 10 : 8 })); const t = sv("text"); t.textContent = i + 1; g.append(t); bg.append(g);
  });
}
function startStory(id) {
  const st = storyById.get(id); if (!st) return;
  S.story = st; S.step = 0; S.list = false; syncView();
  $("storybar").classList.add("on"); goStep(0);
}
function goStep(i) {
  const st = S.story; if (!st) return;
  S.step = Math.max(0, Math.min(st.steps.length - 1, i));
  $("sb-step").textContent = `Story · step ${S.step + 1} of ${st.steps.length}`;
  $("sb-title").textContent = st.title; $("sb-sum").textContent = st.summary || "";
  $("sb-prev").disabled = S.step === 0; $("sb-next").disabled = S.step === st.steps.length - 1;
  select(st.steps[S.step], { center: true, keepStory: true });
}
function endStory() { S.story = null; $("storybar").classList.remove("on"); render(); }

/* ---------- detail panel ---------- */
function relRow(e, n) {
  const other = e.a === n ? e.b : e.a, out = e.a === n;
  return el("li", null, el("button", { onclick: () => select(other.id, { center: true }) },
    el("b", { text: other.title }),
    el("span", { class: "rel" }, out ? "→ " : "← ", el("em", { text: e.label }), ` · ${e.kind}`)));
}
function openPanel(n) {
  const p = $("panel"); p.textContent = "";
  const cl = story.clusters[cIndex.get(n.cluster)];
  p.append(el("button", { class: "close", "aria-label": "Close details", text: "×", onclick: () => select(null) }));
  p.append(el("div", { class: "kicker", style: `--c:${n.color}` }, el("i"), el("span", { text: cl.label }), el("span", { text: "·", "aria-hidden": "true" }), el("span", { text: cap(n.type) })));
  p.append(el("h2", { text: n.title }), el("p", { text: n.summary }));
  if (n.details) p.append(el("p", { class: "details", text: n.details }));
  if (n.evidence) p.append(el("h3", { text: "Evidence" }), el("blockquote", { text: n.evidence }));
  if (n.when) p.append(el("h3", { text: "When" }), el("p", { text: n.when }));
  if (n.themes && n.themes.length) p.append(el("h3", { text: "Themes" }), el("div", { class: "tags" }, n.themes.map((t) => el("span", { class: "tag", text: t }))));
  const rel = edges.filter((e) => e.a === n || e.b === n);
  if (rel.length) p.append(el("h3", { text: `Connections (${rel.length})` }), el("ul", { class: "links" }, rel.map((e) => relRow(e, n))));
  const srcs = (n.sources || []).map((id) => srcById.get(id)).filter(Boolean);
  if (srcs.length) p.append(el("h3", { text: "Sources" }), el("ul", { class: "src" }, srcs.map((s) => {
    const u = safeUrl(s.url);
    return el("li", null, u ? el("a", { href: u, target: "_blank", rel: "noopener noreferrer", text: s.title }) : s.title, s.accessed ? el("small", { text: `Accessed ${s.accessed}` }) : null);
  })));
  const inStories = (story.stories || []).filter((s) => s.steps.includes(n.id));
  if (inStories.length && !S.story) p.append(el("h3", { text: "Appears in" }), el("div", { class: "tags" }, inStories.map((s) => el("button", { class: "chip", text: s.title, onclick: () => startStory(s.id) }))));
  p.classList.add("open"); p.scrollTop = 0;
}
function select(id, opts = {}) {
  if (!opts.keepStory && S.story && id) endStoryQuiet();
  S.selected = id;
  const p = $("panel");
  if (id) { openPanel(byId.get(id)); try { history.replaceState(null, "", "#node=" + encodeURIComponent(id)); } catch {} }
  else { p.classList.remove("open"); try { history.replaceState(null, "", location.pathname + location.search); } catch {} }
  render();
  if (id && opts.center && !S.list) center(byId.get(id));
}
function endStoryQuiet() { S.story = null; $("storybar").classList.remove("on"); }

/* ---------- list view ---------- */
function renderList() {
  const box = $("list"); box.textContent = "";
  let any = false;
  for (const c of story.clusters) {
    const items = nodes.filter((n) => n.cluster === c.id && matches(n));
    if (!items.length) continue; any = true;
    box.append(el("section", null,
      el("h2", { style: `--c:${colors[c.id]}` }, el("i"), c.label),
      el("ul", null, items.map((n) => el("li", null, el("button", { class: "item", style: `--c:${n.color}`, onclick: () => select(n.id) },
        el("small", { text: cap(n.type) }), el("b", { text: n.title }), el("span", { text: n.summary })))))));
  }
  if (!any) box.append(el("p", { text: "No nodes match.", style: "color:var(--muted);text-align:center" }));
}
function syncView() {
  $("list").classList.toggle("on", S.list); svgEl.style.visibility = S.list ? "hidden" : "visible";
  $("zoom").style.display = S.list ? "none" : "";
  $("btn-view").textContent = S.list ? "Explore as graph" : "Explore as list"; $("btn-view").setAttribute("aria-pressed", String(S.list));
  $("btn-fit").style.display = S.list ? "none" : "";
  render();
}

/* ---------- toolbar ---------- */
const usedClusters = new Set(nodes.map((n) => n.cluster));
$("chips").append(el("button", { class: "chip", "data-c": "all", text: "All", onclick: () => { S.filter = "all"; render(); } }));
for (const c of story.clusters) if (usedClusters.has(c.id)) $("chips").append(el("button", { class: "chip", "data-c": c.id, style: `--c:${colors[c.id]}`, onclick: () => { S.filter = S.filter === c.id ? "all" : c.id; render(); } }, el("i"), c.label));
if ((story.stories || []).length) {
  $("stories").append(el("span", { text: "Follow a story" }));
  for (const s of story.stories) $("stories").append(el("button", { class: "chip", "data-s": s.id, title: s.summary || "", text: s.title, onclick: () => (S.story && S.story.id === s.id ? endStory() : startStory(s.id)) }));
}
for (const c of story.clusters) if (usedClusters.has(c.id)) $("legend").append(el("span", { style: `--c:${colors[c.id]}` }, el("i"), c.label));
$("legend").append(el("span", { title: "Relationship directly supported by a cited source" }, (() => { const s = sv("svg", { viewBox: "0 0 22 8" }); s.append(sv("line", { x1: 0, y1: 4, x2: 22, y2: 4, stroke: "currentColor", "stroke-width": 1.5 })); return s; })(), "sourced"));
$("legend").append(el("span", { title: "Editorial bridge: an interpretation, not a direct claim" }, (() => { const s = sv("svg", { viewBox: "0 0 22 8" }); s.append(sv("line", { x1: 0, y1: 4, x2: 22, y2: 4, stroke: "currentColor", "stroke-width": 1.5, "stroke-dasharray": "3 4" })); return s; })(), "inferred"));

$("q").addEventListener("input", (e) => { S.q = e.target.value.trim().toLowerCase(); render(); });
$("btn-view").onclick = () => { S.list = !S.list; syncView(); if (!S.list) requestAnimationFrame(() => fit(false)); };
$("btn-fit").onclick = () => fit();
$("btn-reset").onclick = () => { S.filter = "all"; S.q = ""; $("q").value = ""; endStoryQuiet(); layout(); place(); select(null); fit(); };
$("zin").onclick = () => zoomAt(1.3, svgEl.clientWidth / 2, svgEl.clientHeight / 2);
$("zout").onclick = () => zoomAt(1 / 1.3, svgEl.clientWidth / 2, svgEl.clientHeight / 2);
$("sb-prev").onclick = () => goStep(S.step - 1); $("sb-next").onclick = () => goStep(S.step + 1); $("sb-exit").onclick = endStory;
addEventListener("keydown", (e) => {
  const typing = e.target.tagName === "INPUT";
  if (e.key === "/" && !typing) { e.preventDefault(); $("q").focus(); }
  else if (e.key === "Escape") { if (typing) e.target.blur(); else if (S.selected) select(null); else if (S.story) endStory(); }
  else if (S.story && !typing && e.key === "ArrowRight") goStep(S.step + 1);
  else if (S.story && !typing && e.key === "ArrowLeft") goStep(S.step - 1);
});

/* ---------- pointer interaction: pan, zoom, pinch, drag nodes ---------- */
const ptrs = new Map(); let drag = null;
const toWorld = (cx, cy) => { const r = svgEl.getBoundingClientRect(); return [(cx - r.left - view.x) / view.k, (cy - r.top - view.y) / view.k]; };
const pinchInfo = () => { const [a, b] = [...ptrs.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; };
svgEl.addEventListener("pointerdown", (e) => {
  cancelAnimationFrame(tweenId);
  svgEl.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) { drag = { type: "pinch", ...pinchInfo() }; return; }
  const g = e.target.closest && e.target.closest(".node");
  drag = g ? { type: "node", n: byId.get(g.dataset.id), sx: e.clientX, sy: e.clientY, moved: false }
           : { type: "pan", sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false };
});
svgEl.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!drag) return;

    const p = pinchInfo(), r = svgEl.getBoundingClientRect();
    zoomAt(p.d / drag.d, p.mx - r.left, p.my - r.top); view.x += p.mx - drag.mx; view.y += p.my - drag.my; applyView(); drag = { type: "pinch", ...p }; return;
  }
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; svgEl.classList.add("dragging"); }
  if (!drag.moved) return;
  if (drag.type === "pan") { view.x = drag.vx + dx; view.y = drag.vy + dy; applyView(); }
  else if (drag.type === "node") { const [wx, wy] = toWorld(e.clientX, e.clientY); drag.n.x = wx; drag.n.y = wy; place(); }
});
const endPtr = (e) => {
  ptrs.delete(e.pointerId); svgEl.classList.remove("dragging");
  if (drag && drag.type !== "pinch" && !drag.moved) { if (drag.type === "node") select(drag.n.id, { center: false }); else if (S.selected && !S.story) select(null); }
  if (ptrs.size < 2) drag = null;
};
svgEl.addEventListener("pointerup", endPtr); svgEl.addEventListener("pointercancel", endPtr);
svgEl.addEventListener("wheel", (e) => { e.preventDefault(); const r = svgEl.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
let sized = svgEl.clientWidth > 0 && svgEl.clientHeight > 0, touched = false;
svgEl.addEventListener("pointerdown", () => { touched = true; }); svgEl.addEventListener("wheel", () => { touched = true; }, { passive: true });
const onSize = () => {
  if (S.list || !svgEl.clientWidth || !svgEl.clientHeight) return;
  if (!sized) { sized = true; layout(); place(); fit(false); return; } // first real size (page was loaded hidden / zero-sized)
  if (!touched && !S.selected && !S.story) fit(false);
};
if (window.ResizeObserver) new ResizeObserver(onSize).observe(svgEl); else addEventListener("resize", onSize);

/* ---------- boot ---------- */
layout(); place(); render(); syncView(); fit(false);
function fromHash() {
  const m = /#(node|story)=([^&]+)/.exec(location.hash); if (!m) return;
  const id = decodeURIComponent(m[2]);
  if (m[1] === "node" && byId.has(id) && S.selected !== id) select(id, { center: true });
  else if (m[1] === "story" && storyById.has(id) && !(S.story && S.story.id === id)) startStory(id);
}
addEventListener("hashchange", fromHash);
fromHash();
})();
