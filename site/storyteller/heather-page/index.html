<noscript><h1>Heather Page</h1><p>How a chief of staff&#39;s work shows up in public: an operator&#39;s role, a host&#39;s microphone, and a writing voice that moved from bank-modernization frameworks to weekly AI commentary.</p><p>This interactive story graph needs JavaScript. The full content follows.</p><ul><li><strong>Heather Page</strong>: Chief of Staff at TribalScale, a technology consultancy with offices in Toronto, New York and Miami; in public she is an operator, a podcast host, and a bylined writer.</li><li><strong>Chief of Staff</strong>: The job was created when the CEO went looking for a Chief of Staff in late 2020; it is the thread that runs through everything else she publishes.</li><li><strong>CEO&#39;s sounding board</strong>: Her own short definition of the job: a safe place for the CEO to test half-formed ideas.</li><li><strong>The 30-60-90 day plan</strong>: The role began as a written plan: she and the CEO built the job description and a 90-day plan together, after she spoke with other leaders.</li><li><strong>A Chief of Staff with no COO</strong>: Because TribalScale had no COO, the role was more hands-on with operations than the moonshot-and-partnerships version of the job.</li><li><strong>Regular team check-ins</strong>: Her method for seeing how the company really works: ongoing check-ins across the whole team, with insights passed to the CEO.</li><li><strong>Shaping senior hiring</strong>: She was involved in senior hires from her first days and helped shape the hiring process.</li><li><strong>Working with the leadership team</strong>: The interview names the colleagues she worked most closely with across revenue, product/design, and engineering.</li><li><strong>MBA and a decade in tech</strong>: The only professional background the sources give: an MBA and roughly ten years across customer success, marketplace management, and chief-of-staff roles.</li><li><strong>First Name Basis podcast</strong>: TribalScale&#39;s podcast; in 2022 she hosted two guest conversations and was herself interviewed once.</li><li><strong>Workplace wellness series</strong>: A two-part conversation she hosted for Mental Health Awareness Month with the co-founder of Inward Strong; the subject is the guest&#39;s field, not the host&#39;s.</li><li><strong>Episode: The Chief of Staff Role</strong>: The episode where the roles flip: the CEO interviews her about the job, her work with the leadership team, and challenges she overcame.</li><li><strong>Episode: Gender Equity in Web3</strong>: She hosted the founder of Web3 Equity on skill-building for allies, accessibility challenges, and the Web3 community in Miami.</li><li><strong>Modernization Index</strong>: The scoring framework behind her financial-services series: four pillars scored on a scale where 3 means &#39;standardizing&#39; and 5 means &#39;adaptive&#39;.</li><li><strong>The six profiles (and hybrids)</strong>: The capstone of a six-part series: six archetypes of a bank&#39;s modernization, with the argument that real institutions are hybrids that migrate over time.</li><li><strong>The AI Experimenter</strong>: Profile 1 of 6: strong AI pilots sitting on a weak data and governance base, which keeps the pilots from scaling.</li><li><strong>The Balanced Modernizer</strong>: The contrarian profile: an institution with no weak pillar, which she argues is stuck because nothing forces a concentrated bet.</li><li><strong>Beyond Inheritance</strong>: A warning to banks that heirs who receive boomer wealth may not keep the accounts their parents held.</li><li><strong>The Nostalgia Gold Mine</strong>: Off-topic for banking: media companies&#39; content archives as an asset, using Disney+ and Formula 1 as examples.</li><li><strong>Call Centers: The Untapped Goldmine</strong>: Her piece in FinScale Vol. 2, listed by title and byline only; the article itself sits inside the magazine download and was not read.</li><li><strong>FinScale magazine</strong>: TribalScale&#39;s digital magazine for banking and insurance leaders, which carries at least two of her pieces.</li><li><strong>A Brief History of Toronto&#39;s Tech Events</strong>: Her community-history essay: Toronto&#39;s tech scene was built event by event by practitioners, and institutions followed.</li><li><strong>Xtreme Labs lineage</strong>: The Toronto product studio whose alumni, including TribalScale&#39;s CEO, carried its culture into the wider scene.</li><li><strong>TakeOver conference</strong>: TribalScale&#39;s own contribution to the scene: a Toronto innovation conference run in 2017 and 2018.</li><li><strong>From grassroots to government</strong>: The essay&#39;s argument: public institutions arrived after the community had already shown what it could do, from FITC and MaRS to Collision.</li><li><strong>Toronto Tech Week</strong>: The essay&#39;s endpoint and its timing hook: a city-backed, multi-year grassroots tech week.</li><li><strong>TribalScale Substack</strong>: A company newsletter launched in late 2025 that now carries her byline on nearly every post; it is where her public writing shifted to AI strategy.</li><li><strong>88% use it, 7% scaled it</strong>: Her diagnosis of enterprise AI: the gap is organizational, not technical, because no one tied the pilot to a business outcome.</li><li><strong>The &#39;could you explain it&#39; test</strong>: TribalScale&#39;s stated internal gate for shipping an agent feature, offered in the essay as the practice that separates products from demos.</li><li><strong>Where AI lock-in really lives</strong>: Her argument that vendor lock-in sits in workflows, memory and institutional context rather than in the model API.</li><li><strong>Flagging who is selling</strong>: A recurring move in her posts: noting when a cited survey or figure comes from a party with something to sell.</li><li><strong>The case for building cheap</strong>: A report on TribalScale&#39;s own internal agents, used to argue that simple, governed architectures beat expensive ones in early adoption.</li><li><strong>Daily cycles, not sprints</strong>: Her opinion that if AI collapses the cost of drafting code, the two-week sprint is sized for a bottleneck that has shrunk.</li><li><strong>Proximity beats documentation</strong>: A rare post where she writes about TribalScale&#39;s origins: builders in the room with the people they build for are the structural answer to misalignment, more so when agents multiply it.</li><li><strong>TribalScale</strong>: The technology consultancy that employs her and publishes nearly everything in this study.</li><li><strong>Sheetal Jaitly</strong>: TribalScale&#39;s CEO: the person she works for, interviews on the podcast, and whose background she traces in her origins post.</li><li><strong>How TribalScale works</strong>: The company&#39;s stated method: five steps from Frame to Next Bets, worked in tight cycles.</li><li><strong>Design writing: not found</strong>: An honest gap: no design-process or AI-design-process writing under her name turned up; the closest thread is her profile&#39;s line about customer pain points.</li></ul></noscript>

o add to his team.","when":"late 2020 to present","sources":["med","prof"]},{"id":"sounding-board","title":"CEO's sounding board","type":"idea","cluster":"role","summary":"Her own short definition of the job: a safe place for the CEO to test half-formed ideas.","evidence":"a sounding board for the CEO to bounce ideas off of without judgement","when":"2022 interview","sources":["med"]},{"id":"plan","title":"The 30-60-90 day plan","type":"event","cluster":"role","summary":"The role began as a written plan: she and the CEO built the job description and a 90-day plan together, after she spoke with other leaders.","evidence":"including the development of a 30–60–90 day plan to overcome the obstacles that TribalScale was facing","when":"late 2020","sources":["med"]},{"id":"no-coo","title":"A Chief of Staff with no COO","type":"idea","cluster":"role","summary":"Because TribalScale had no COO, the role was more hands-on with operations than the moonshot-and-partnerships version of the job.","evidence":"because we don’t have a COO, Heather is able to keep most of those COO responsibilities within the CEO’s office","when":"2022 interview","sources":["med"]},{"id":"checkins","title":"Regular team check-ins","type":"practice","cluster":"role","summary":"Her method for seeing how the company really works: ongoing check-ins across the whole team, with insights passed to the CEO.","evidence":"implementing regular check-ins to understand how people work and what is not working for them","when":"2022 interview","sources":["med"]},{"id":"hiring","title":"Shaping senior hiring","type":"practice","cluster":"role","summary":"She was involved in senior hires from her first days and helped shape the hiring process.","evidence":"playing a key role in hiring senior staff members since day one","when":"2022 interview","sources":["med"]},{"id":"leadership-team","title":"Working with the leadership team","type":"practice","cluster":"role","summary":"The interview names the colleagues she worked most closely with across revenue, product/design, and engineering.","details":"Titles as of March 2022: Chief Revenue Officer Rich Gigante, VP of Product/Design Krys Krycinski, Director of Engineering Jason Mills.","evidence":"regularly communicates with our senior leaders including our Chief Revenue Officer, Rich Gigante","when":"2022","sources":["med"]},{"id":"background","title":"MBA and a decade in tech","type":"background","cluster":"role","summary":"The only professional background the sources give: an MBA and roughly ten years across customer success, marketplace management, and chief-of-staff roles.","details":"Employers before TribalScale are not named in any source read for this study, so none are listed.","evidence":"an MBA from the Schulich School of Business, and has close to 10 years of experience in the tech industry","when":"as of 2022","sources":["med"]},{"id":"fnb","title":"First Name Basis podcast","type":"media","cluster":"mic","featured":true,"summary":"TribalScale's podcast; in 2022 she hosted two guest conversations and was herself interviewed once.","evidence":"Apple Podcasts dates the four episodes involving her 2022-05-12, 2022-05-19, 2022-06-23 and 2022-11-03.","when":"2022","sources":["ap","prof"]},{"id":"mh-series","title":"Workplace wellness series","type":"episode","cluster":"mic","summary":"A two-part conversation she hosted for Mental Health Awareness Month with the co-founder of Inward Strong; the subject is the guest's field, not the host's.","evidence":"For Mental Health Awareness Month, Host Heather Page is joined by Monique Peats, Co-founder and Chief Clinical Director at Inward Strong.","when":"May 2022","sources":["pod-m1","pod-m2","ap"]},{"id":"cos-ep","title":"Episode: The Chief of Staff Role","type":"episode","cluster":"mic","summary":"The episode where the roles flip: the CEO interviews her about the job, her work with the leadership team, and challenges she overcame.","details":"Only the episode description was read, not the audio.","evidence":"This week TribalScale CEO, Sheetal Jaitly, is joined by our Chief of Staff, Heather Page.","when":"2022-06-23","sources":["pod-cos","ap"]},{"id":"web3-ep","title":"Episode: Gender Equity in Web3","type":"episode","cluster":"mic","summary":"She hosted the founder of Web3 Equity on skill-building for allies, accessibility challenges, and the Web3 community in Miami.","evidence":"TribalScale Chief of Staff, Heather Page, is joined by Michelle Abbs, Founder and CEO of Web3 Equity","when":"2022-11-03","sources":["pod-web3","ap"]},{"id":"fsi-index","title":"Modernization Index","type":"framework","cluster":"fsi","featured":true,"summary":"The scoring framework behind her financial-services series: four pillars scored on a scale where 3 means 'standardizing' and 5 means 'adaptive'.","evidence":"Data Foundation & Architecture, Governance & Regulatory Readiness, AI & Real-Time Decisioning, and Customer Intelligence & Personalization","when":"2025-2026","sources":["ax","bal"]},{"id":"six-profiles","title":"The six profiles (and hybrids)","type":"article","cluster":"fsi","summary":"The capstone of a six-part series: six archetypes of a bank's modernization, with the argument that real institutions are hybrids that migrate over time.","details":"Only two of the six profile articles appear on her profile page's visible list; the byline of the other four was not checked.","evidence":"The six archetypes are models, not identities.","sources":["six","prof"]},{"id":"experimenter","title":"The AI Experimenter","type":"article","cluster":"fsi","summary":"Profile 1 of 6: strong AI pilots sitting on a weak data and governance base, which keeps the pilots from scaling.","details":"Its recommended move is to freeze the model inventory and spend two quarters on data foundation and governance. The article calls it the most common profile in financial services; that is TribalScale's claim.","evidence":"AI & Real-Time Decisioning scores a 3.5 or higher.","sources":["ax"]},{"id":"balanced","title":"The Balanced Modernizer","type":"article","cluster":"fsi","summary":"The contrarian profile: an institution with no weak pillar, which she argues is stuck because nothing forces a concentrated bet.","evidence":"Data Foundation is at 3.2. Governance is at 3.5. AI & Real-Time Decisioning is at 3.0. Customer Intelligence is at 3.3.","sources":["bal"]},{"id":"beyond","title":"Beyond Inheritance","type":"article","cluster":"fsi","summary":"A warning to banks that heirs who receive boomer wealth may not keep the accounts their parents held.","details":"The figures are stated in the article without citation. The rest of the piece is in the gated FinScale magazine download and was not read.","evidence":"$84 trillion moving from baby boomers to their heirs over the next two decades","sources":["beyond"]},{"id":"nostalgia","title":"The Nostalgia Gold Mine","type":"article","cluster":"fsi","summary":"Off-topic for banking: media companies' content archives as an asset, using Disney+ and Formula 1 as examples.","evidence":"Think of it like a museum curator rather than a warehouse manager.","sources":["nost"]},{"id":"call-centers","title":"Call Centers: The Untapped Goldmine","type":"article","cluster":"fsi","summary":"Her piece in FinScale Vol. 2, listed by title and byline only; the article itself sits inside the magazine download and was not read.","evidence":"Call Centers: The Untapped Goldmine (by Heather Page)","when":"September 2025","sources":["fs2"]},{"id":"finscale","title":"FinScale magazine","type":"publication","cluster":"fsi","summary":"TribalScale's digital magazine for banking and insurance leaders, which carries at least two of her pieces.","evidence":"a new digital publication dedicated to providing insights and strategies for the financial services and insurance (FSI) industries","when":"launched 2025-05-05","sources":["fs1","fs2"]},{"id":"toronto-history","title":"A Brief History of Toronto's Tech Events","type":"article","cluster":"toronto","featured":true,"summary":"Her community-history essay: Toronto's tech scene was built event by event by practitioners, and institutions followed.","evidence":"In 2017, we rented out the Arcadian Court, booked 30 speakers from six countries, and called it TakeOver.","when":"posted 2026-05-25","sources":["hist","prof","sub-idx"]},{"id":"xtreme","title":"Xtreme Labs lineage","type":"organisation","cluster":"toronto","summary":"The Toronto product studio whose alumni, including TribalScale's CEO, carried its culture into the wider scene.","details":"The essay says the CEO was Director of Business Development at Xtreme and later moved into telecommunications and IoT under Pivotal, which acquired Xtreme.","evidence":"Founded in 2007 by Amar Varma and Sunny Madra","when":"2007-2013","sources":["hist","sub-align"]},{"id":"takeover","title":"TakeOver conference","type":"event","cluster":"toronto","summary":"TribalScale's own contribution to the scene: a Toronto innovation conference run in 2017 and 2018.","details":"The essay is inconsistent about the first year: one paragraph says it brought together 600 executives, investors and leaders, another says over 800 attended. Both figures are the company's; neither is resolved here. For 2018 it reports a sell-out with 1,700 attendees and the debut of the Venture Studios program.","evidence":"We did our first TakeOver in 2017 with over 800 attendees.","when":"2017, 2018","sources":["hist"]},{"id":"gov-arc","title":"From grassroots to government","type":"thesis","cluster":"toronto","summary":"The essay's argument: public institutions arrived after the community had already shown what it could do, from FITC and MaRS to Collision.","evidence":"from passive to participatory, after the community put in the work","sources":["hist"]},{"id":"tech-week","title":"Toronto Tech Week","type":"event","cluster":"toronto","summary":"The essay's endpoint and its timing hook: a city-backed, multi-year grassroots tech week.","evidence":"The 2025 debut brought together more than 15,000 attendees across 315 events and 500 speakers spanning 27 neighbourhoods","when":"2025; May 25-29, 2026","sources":["hist"]},{"id":"substack","title":"TribalScale Substack","type":"publication","cluster":"ai","featured":true,"summary":"A company newsletter launched in late 2025 that now carries her byline on nearly every post; it is where her public writing shifted to AI strategy.","details":"The archive lists 23 posts from 2025-10-30 to 2026-09-30; 22 show Heather Page in the byline field. How each post was drafted is not stated, so this study says 'bylined', not more. Several posts are curated commentary with reading lists.","evidence":"We’ve launched our Substack as a home for deeper thinking on technology, transformation, and the future of how we build.","when":"launched 2025","sources":["sub-ten","sub-idx"]},{"id":"pilots-gap","title":"88% use it, 7% scaled it","type":"essay","cluster":"ai","summary":"Her diagnosis of enterprise AI: the gap is organizational, not technical, because no one tied the pilot to a business outcome.","details":"The figures come from a McKinsey survey as reported in the essay; she also cites a Publicis Sapient survey.","evidence":"Only 7% of companies say they’ve fully scaled AI across their organization.","when":"2026-07-16","sources":["sub-88"]},{"id":"explain-test","title":"The 'could you explain it' test","type":"practice","cluster":"ai","summary":"TribalScale's stated internal gate for shipping an agent feature, offered in the essay as the practice that separates products from demos.","details":"This is a company statement about its own process, not independently verified.","evidence":"could you explain why it just did that? If you can’t, you don’t have a product, you have a demo.","when":"2026-07-16","sources":["sub-88"]},{"id":"lockin","title":"Where AI lock-in really lives","type":"essay","cluster":"ai","summary":"Her argument that vendor lock-in sits in workflows, memory and institutional context rather than in the model API.","details":"The essay reports that 58% of those who tried to switch said the migration failed or cost far more than expected. A related essay asks, of OpenAI's new deployment company, 'embedded by whom, and building toward what?'","evidence":"90% of executives believed they could switch AI vendors within four weeks.","when":"2026-04-30, 2026-05-13","sources":["sub-lock","sub-oai"]},{"id":"source-caveats","title":"Flagging who is selling","type":"habit","cluster":"ai","summary":"A recurring move in her posts: noting when a cited survey or figure comes from a party with something to sell.","details":"Three examples across posts: Publicis Sapient (org-redesign work), Zapier (workflow orchestration), DXC's own delivery estimates.","evidence":"Worth noting those figures are DXC’s own estimates, not independently verified.","when":"2026","sources":["sub-fde","sub-88","sub-lock"]},{"id":"build-cheap","title":"The case for building cheap","type":"essay","cluster":"ai","summary":"A report on TribalScale's own internal agents, used to argue that simple, governed architectures beat expensive ones in early adoption.","details":"All figures, including the four-month timeline and the days-to-15-minutes case-study claim, are TribalScale's own and unverified.","evidence":"The platform runs for $20-40 USD per day across all active workflows.","when":"2026-06-24","sources":["sub-cheap"]},{"id":"sprint","title":"Daily cycles, not sprints","type":"essay","cluster":"ai","summary":"Her opinion that if AI collapses the cost of drafting code, the two-week sprint is sized for a bottleneck that has shrunk.","evidence":"teams should move to daily cycles, not two-week ones.","when":"2026-07-31","sources":["sub-sprint"]},{"id":"alignment","title":"Proximity beats documentation","type":"essay","cluster":"ai","summary":"A rare post where she writes about TribalScale's origins: builders in the room with the people they build for are the structural answer to misalignment, more so when agents multiply it.","evidence":"proximity is the only structural answer to the alignment problem","when":"2026-05-25","sources":["sub-align"]},{"id":"tribalscale","title":"TribalScale","type":"organisation","cluster":"context","featured":true,"summary":"The technology consultancy that employs her and publishes nearly everything in this study.","evidence":"Our method blends human-centred design, agile cycles, and AI-powered engineering.","sources":["how","hist"]},{"id":"sheetal","title":"Sheetal Jaitly","type":"person","cluster":"context","summary":"TribalScale's CEO: the person she works for, interviews on the podcast, and whose background she traces in her origins post.","details":"Identified in the sources as the CEO who founded TribalScale in November 2015 after Xtreme Labs and Pivotal.","evidence":"Sheetal Jaitly, CEO of TribalScale","sources":["fs1","med","hist"]},{"id":"how-we-work","title":"How TribalScale works","type":"method","cluster":"context","summary":"The company's stated method: five steps from Frame to Next Bets, worked in tight cycles.","evidence":"We work in tight cycles—aligning daily, shipping weekly, pivoting instantly.","sources":["how"]},{"id":"design-gap","title":"Design writing: not found","type":"seam","cluster":"context","summary":"An honest gap: no design-process or AI-design-process writing under her name turned up; the closest thread is her profile's line about customer pain points.","details":"Her profile page shows a 'Load More' after six articles, and the full list could not be expanded. The Substack archive titles contain no design-process post by her; one design-led piece summarises a FinScale article by Anna Foat.","evidence":"creating solutions that solve meaningful pain points","sources":["prof","sub-idx","how"]}],"edges":[{"source":"heather","target":"cos-role","label":"holds the role of","kind":"explicit","sources":["prof","med"]},{"source":"sheetal","target":"cos-role","label":"went lo   if (n.when) p.append(el("h3", { text: "When" }), el("p", { text: n.when }));
  if (n.themes && n.themes.length) p.append(el("h3", { text: "Themes" }), el("div", { class: "tags" }, n.themes.map((t) => el("span", { class: "tag", text: t }))));
  const rel = edges.filter((e) => e.a === n || e.b === n);
  if (rel.length) p.append(el("h3", { text: `Connections (${rel.length})` }), el("ul", { class: "links" }, rel.map((e) => relRow(e, n))));
  const srcs = (n.sources || []).map((id) => srcById.get(id)).filter(Boolean);
  if (srcs.length) p.append(el("h3", { text: "Sources" }), el("ul", { class: "src" }, srcs.map((s) => {
    const u = safeUrl(s.url);
    return el("li", null, u ? el("a", { href: u, target: "_blank", rel: "noopener noreferrer", text: s.title }) : s.title, s.accessed ? el("small", { text: `Accessed ${s.accessed}` }) : null);
  })));
  const inStories = (story.stories || []).filter((s) => s.steps.includes(n.id));
  if (inStories.length && !S.story) p.append(el("h3", { text: "Appears in" }), el("div", { class: "tags" }, inStories.map((s) => el("button", { class: "chip", text: s.title, onclick: () => startStory(s.id) }))));
  p.classList.add("open"); p.scrollTop = 0;
}
function select(id, opts = {}) {
  if (!opts.keepStory && S.story && id) endStoryQuiet();
  S.selected = id;
  const p = $("panel");
  if (id) { openPanel(byId.get(id)); try { history.replaceState(null, "", "#node=" + encodeURIComponent(id)); } catch {} }
  else { p.classList.remove("open"); try { history.replaceState(null, "", location.pathname + location.search); } catch {} }
  render();
  if (id && opts.center && !S.list) center(byId.get(id));
}
function endStoryQuiet() { S.story = null; $("storybar").classList.remove("on"); }

/* ---------- list view ---------- */
function renderList() {
  const box = $("list"); box.textContent = "";
  let any = false;
  for (const c of story.clusters) {
    const items = nodes.filter((n) => n.cluster === c.id && matches(n));
    if (!items.length) continue; any = true;
    box.append(el("section", null,
      el("h2", { style: `--c:${colors[c.id]}` }, el("i"), c.label),
      el("ul", null, items.map((n) => el("li", null, el("button", { class: "item", style: `--c:${n.color}`, onclick: () => select(n.id) },
        el("small", { text: cap(n.type) }), el("b", { text: n.title }), el("span", { text: n.summary })))))));
  }
  if (!any) box.append(el("p", { text: "No nodes match.", style: "color:var(--muted);text-align:center" }));
}
function syncView() {
  $("list").classList.toggle("on", S.list); svgEl.style.visibility = S.list ? "hidden" : "visible";
  $("zoom").style.display = S.list ? "none" : "";
  $("btn-view").textContent = S.list ? "Explore as graph" : "Explore as list"; $("btn-view").setAttribute("aria-pressed", String(S.list));
  $("btn-fit").style.display = S.list ? "none" : "";
  render();
}

/* ---------- toolbar ---------- */
const usedClusters = new Set(nodes.map((n) => n.cluster));
$("chips").append(el("button", { class: "chip", "data-c": "all", text: "All", onclick: () => { S.filter = "all"; render(); } }));
for (const c of story.clusters) if (usedClusters.has(c.id)) $("chips").append(el("button", { class: "chip", "data-c": c.id, style: `--c:${colors[c.id]}`, onclick: () => { S.filter = S.filter === c.id ? "all" : c.id; render(); } }, el("i"), c.label));
if ((story.stories || []).length) {
  $("stories").append(el("span", { text: "Follow a story" }));
  for (const s of story.stories) $("stories").append(el("button", { class: "chip", "data-s": s.id, title: s.summary || "", text: s.title, onclick: () => (S.story && S.story.id === s.id ? endStory() : startStory(s.id)) }));
}
for (const c of story.clusters) if (usedClusters.has(c.id)) $("legend").append(el("span", { style: `--c:${colors[c.id]}` }, el("i"), c.label));
$("legend").append(el("span", { title: "Relationship directly supported by a cited source" }, (() => { const s = sv("svg", { viewBox: "0 0 22 8" }); s.append(sv("line", { x1: 0, y1: 4, x2: 22, y2: 4, stroke: "currentColor", "stroke-width": 1.5 })); return s; })(), "sourced"));
$("legend").append(el("span", { title: "Editorial bridge: an interpretation, not a direct claim" }, (() => { const s = sv("svg", { viewBox: "0 0 22 8" }); s.append(sv("line", { x1: 0, y1: 4, x2: 22, y2: 4, stroke: "currentColor", "stroke-width": 1.5, "stroke-dasharray": "3 4" })); return s; })(), "inferred"));

$("q").addEventListener("input", (e) => { S.q = e.target.value.trim().toLowerCase(); render(); });
$("btn-view").onclick = () => { S.list = !S.list; syncView(); if (!S.list) requestAnimationFrame(() => fit(false)); };
$("btn-fit").onclick = () => fit();
$("btn-reset").onclick = () => { S.filter = "all"; S.q = ""; $("q").value = ""; endStoryQuiet(); layout(); place(); select(null); fit(); };
$("zin").onclick = () => zoomAt(1.3, svgEl.clientWidth / 2, svgEl.clientHeight / 2);
$("zout").onclick = () => zoomAt(1 / 1.3, svgEl.clientWidth / 2, svgEl.clientHeight / 2);
$("sb-prev").onclick = () => goStep(S.step - 1); $("sb-next").onclick = () => goStep(S.step + 1); $("sb-exit").onclick = endStory;
addEventListener("keydown", (e) => {
  const typing = e.target.tagName === "INPUT";
  if (e.key === "/" && !typing) { e.preventDefault(); $("q").focus(); }
  else if (e.key === "Escape") { if (typing) e.target.blur(); else if (S.selected) select(null); else if (S.story) endStory(); }
  else if (S.story && !typing && e.key === "ArrowRight") goStep(S.step + 1);
  else if (S.story && !typing && e.key === "ArrowLeft") goStep(S.step - 1);
});

/* ---------- pointer interaction: pan, zoom, pinch, drag nodes ---------- */
const ptrs = new Map(); let drag = null;
const toWorld = (cx, cy) => { const r = svgEl.getBoundingClientRect(); return [(cx - r.left - view.x) / view.k, (cy - r.top - view.y) / view.k]; };
const pinchInfo = () => { const [a, b] = [...ptrs.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; };
svgEl.addEventListener("pointerdown", (e) => {
  cancelAnimationFrame(tweenId);
  svgEl.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) { drag = { type: "pinch", ...pinchInfo() }; return; }
  const g = e.target.closest && e.target.closest(".node");
  drag = g ? { type: "node", n: byId.get(g.dataset.id), sx: e.clientX, sy: e.clientY, moved: false }
           : { type: "pan", sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false };
});
svgEl.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!drag) return;
  if (drag.type === "pinch" && ptrs.size === 2) {
    const p = pinchInfo(), r = svgEl.getBoundingClientRect();
    zoomAt(p.d / drag.d, p.mx - r.left, p.my - r.top); view.x += p.mx - drag.mx; view.y += p.my - drag.my; applyView(); drag = { type: "pinch", ...p }; return;
  }
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; svgEl.classList.add("dragging"); }
  if (!drag.moved) return;
  if (drag.type === "pan") { view.x = drag.vx + dx; view.y = drag.vy + dy; applyView(); }
  else if (drag.type === "node") { const [wx, wy] = toWorld(e.clientX, e.clientY); drag.n.x = wx; drag.n.y = wy; place(); }
});
const endPtr = (e) => {
  ptrs.delete(e.pointerId); svgEl.classList.remove("dragging");
  if (drag && drag.type !== "pinch" && !drag.moved) { if (drag.type === "node") select(drag.n.id, { center: false }); else if (S.selected && !S.story) select(null); }
  if (ptrs.size < 2) drag = null;
};
svgEl.addEventListener("pointerup", endPtr); svgEl.addEventListener("pointercancel", endPtr);
svgEl.addEventListener("wheel", (e) => { e.preventDefault(); const r = svgEl.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
let sized = svgEl.clientWidth > 0 && svgEl.clientHeight > 0, touched = false;
svgEl.addEventListener("pointerdown", () => { touched = true; }); svgEl.addEventListener("wheel", () => { touched = true; }, { passive: true });
const onSize = () => {
  if (S.list || !svgEl.clientWidth || !svgEl.clientHeight) return;
  if (!sized) { sized = true; layout(); place(); fit(false); return; } // first real size (page was loaded hidden / zero-sized)
  if (!touched && !S.selected && !S.story) fit(false);
};
if (window.ResizeObserver) new ResizeObserver(onSize).observe(svgEl); else addEventListener("resize", onSize);

/* ---------- boot ---------- */
layout(); place(); render(); syncView(); fit(false);
function fromHash() {
  const m = /#(node|story)=([^&]+)/.exec(location.hash); if (!m) return;
  const id = decodeURIComponent(m[2]);
  if (m[1] === "node" && byId.has(id) && S.selected !== id) select(id, { center: true });
  else if (m[1] === "story" && storyById.has(id) && !(S.story && S.story.id === id)) startStory(id);
}
addEventListener("hashchange", fromHash);
fromHash();
})();
</script>
