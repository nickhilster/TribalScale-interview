<noscript><h1>Haseeb Danyal</h1><p>A map of how Haseeb Danyal’s public work makes design more legible: for users, business partners, and the designers doing the work.</p><p>This interactive story graph needs JavaScript. The full content follows.</p><ul><li><strong>Haseeb Danyal</strong>: A product designer and design leader whose public work spans product experiences, design operations, and the growth of design teams.</li><li><strong>Software to product design</strong>: Haseeb’s bio describes a move from software engineering into product design, connecting technical practice with user experience.</li><li><strong>Design maturity</strong>: His bio frames the work as helping organizations build design maturity through team coaching, processes, and frameworks.</li><li><strong>Design leadership at TribalScale</strong>: TribalScale’s profile places him in its design leadership function and describes work across product design, research, and leadership.</li><li><strong>PATARI redesign</strong>: An older portfolio project shows product and visual-design work predating the later DesignOps case studies.</li><li><strong>DesignOps practice</strong>: Across his case studies, DesignOps appears as the connective work around design: organizing files, clarifying processes, and helping people collaborate.</li><li><strong>People, process, craft</strong>: NN/g’s framework gives useful context for the portfolio: DesignOps combines team support, workable processes, and consistent design craft.</li><li><strong>Repeated handovers</strong>: The mobileLIVE article describes repeated walkthroughs and duplicate presentation work as a drain on designers’ time.</li><li><strong>A shared design language</strong>: The proposed response is to make design files and decisions understandable to people outside the design team.</li><li><strong>Design-file statuses</strong>: A shared set of status labels lets collaborators see whether a screen or flow is underway, ready for review, approved, or archived.</li><li><strong>Comment keys</strong>: Comment keys document design decisions, questions, and concerns in the files where the work is discussed.</li><li><strong>The UX playbook</strong>: An interactive Figma prototype translated the team’s design activities into an explanation business stakeholders could use.</li><li><strong>Five stages of design</strong>: The playbook grouped work into Discover, Research, Sketch, Design, and Measure, making the parts around interface production visible too.</li><li><strong>A living team document</strong>: The playbook was described as an evolving document owned by the design team rather than a one-time presentation.</li><li><strong>Designer career ladder</strong>: At mobileLIVE, Haseeb’s case study describes a career framework intended to make growth paths and expectations clearer as the design team expanded.</li><li><strong>Two growth tracks</strong>: After senior level, designers could choose an individual-contributor or leadership track, and the case study says switching remained possible.</li><li><strong>Clear role expectations</strong>: The framework set expectations for each design role, mixing craft skills with communication and other people skills.</li><li><strong>Annual skill assessments</strong>: A yearly assessment compared role expectations with input from designers, client-side stakeholders, and design leads.</li><li><strong>A word-based skill scale</strong>: The example uses plain-language ratings from improving to excelling; the displayed radar chart is hypothetical.</li><li><strong>Goals and weekly check-ins</strong>: The article links assessment results to achievable development goals and weekly one-on-ones between designers and leads.</li><li><strong>JazzCash home redesign</strong>: Haseeb describes leading the redesign while also working hands-on on selected experiences, bringing team alignment and product UX into one case.</li><li><strong>Research shapes direction</strong>: Interviews with users and business stakeholders informed the pain points and priorities described in the redesign case study.</li><li><strong>Access, discovery, control</strong>: The design goals focused on making actions easier to find, improving service discovery, and giving users more control.</li><li><strong>Personalized home services</strong>: A central section let people place their four most-used services on the home screen; business-promoted services sat separately below it.</li><li><strong>Reported feature uptake</strong>: The portfolio reports that more than 85% of users used and customized the feature within two months.</li><li><strong>Design system as work grew</strong>: Reusable components were added alongside new screens, with team huddles used to review and accept additions.</li><li><strong>Usability measures</strong>: The portfolio reports SEQ and SUPR-Q scores for the redesigned experience, as well as a SUS result for account information.</li><li><strong>Not a Journal challenge</strong>: A short self-initiated challenge shows another version of the same research-to-interface process, from interviews through personas, journey, prototypes, and reflection.</li><li><strong>Leadership as enablement</strong>: Haseeb’s leadership essay defines the job through creating safety, guidance, and room for people to grow, rather than only assigning work.</li><li><strong>Meaningful one-on-ones</strong>: He recommends tailoring check-ins to people’s concerns, motivations, roles, and goals.</li><li><strong>Empower, don’t micromanage</strong>: The essay argues that leaders succeed when their teams can deliver without constant intervention.</li><li><strong>Colleagues describe the practice</strong>: Hosted testimonials from a design-operations leader and designers praise Haseeb’s team-building, coaching, and collaborative style.</li><li><strong>Measure the whole system</strong>: In a 2024 essay, Haseeb groups design-team measurement around who is on the team, how work happens, and the outcomes it creates.</li></ul></noscript>

gnOps practice","type":"practice","cluster":"design-ops","featured":true,"summary":"Across his case studies, DesignOps appears as the connective work around design: organizing files, clarifying processes, and helping people collaborate.","details":"This is a synthesis across the cited projects, rather than a formal job title attached to every initiative.","evidence":"DesignOps is a collective term for addressing challenges such as growing teams and creating efficient workflows","sources":["nng","playbook","mobilelive-collab"],"themes":["design operations","collaboration"]},{"id":"designops-frame","title":"People, process, craft","type":"framework","cluster":"design-ops","summary":"NN/g’s framework gives useful context for the portfolio: DesignOps combines team support, workable processes, and consistent design craft.","evidence":"the orchestration and optimization of people, processes, and craft","sources":["nng"],"themes":["design operations","framework"]},{"id":"stakeholder-friction","title":"Repeated handovers","type":"problem","cluster":"design-ops","summary":"The mobileLIVE article describes repeated walkthroughs and duplicate presentation work as a drain on designers’ time.","evidence":"repeated walkthroughs and presentation tasks reduced time for solving user and product problems","sources":["mobilelive-collab"],"themes":["collaboration","workflow"]},{"id":"shared-language","title":"A shared design language","type":"practice","cluster":"design-ops","featured":true,"summary":"The proposed response is to make design files and decisions understandable to people outside the design team.","evidence":"the shared language will help stakeholders understand how design files are organized and documented","sources":["mobilelive-collab"],"themes":["stakeholders","communication"]},{"id":"file-status","title":"Design-file statuses","type":"tool","cluster":"design-ops","summary":"A shared set of status labels lets collaborators see whether a screen or flow is underway, read hin the organization","sources":["careers"],"themes":["career","team development"]},{"id":"dual-track","title":"Two growth tracks","type":"framework","cluster":"team-growth","summary":"After senior level, designers could choose an individual-contributor or leadership track, and the case study says switching remained possible.","evidence":"designers can decide to pursue either the individual contributor path or the leadership path","sources":["careers"],"themes":["career","leadership"]},{"id":"role-expectations","title":"Clear role expectations","type":"framework","cluster":"team-growth","summary":"The framework set expectations for each design role, mixing craft skills with communication and other people skills.","evidence":"a good mix of hard and soft skills","sources":["careers"],"themes":["career","skills"]},{"id":"annual-assessments","title":"Annual skill assessments","type":"practice","cluster":"team-growth","summary":"A yearly assessment compared role expectations with input from designers, client-side stakeholders, and design leads.","evidence":"we run skill assessments once a year","sources":["careers"],"themes":["feedback","growth"]},{"id":"skill-scale","title":"A word-based skill scale","type":"tool","cluster":"team-growth","summary":"The example uses plain-language ratings from improving to excelling; the displayed radar chart is hypothetical.","details":"The source says the scale was learned from Salesforce. That provenance is reported by the author and not separately investigated.","evidence":"0 non-scoring; 1 improving; 2 achieving; 3 excelling","sources":["careers"],"themes":["assessment","communication"]},{"id":"growth-conversations","title":"Goals and weekly check-ins","type":"practice","cluster":"team-growth","summary":"The article links assessment results to achievable development goals and weekly one-on-ones between designers and leads.","evidence":"the conversation is carried over to weekly one-on-ones","sources":["careers"],"themes":["mentoring","growth"]},{"id":"jazzcash","title":"JazzCash home redesign","type":"project","cluster":"product-design","featured":true,"summary":"Haseeb describes leading the redesign while also working hands-on on selected experiences, bringing team alignment and product UX into one case.","evidence":"I led the redesign for one of the largest and most actively used mobile wallets in South Asia","sources":["jazzcash"],"themes":["product design","leadership"]},{"id":"user-research","title":"Research shapes direction","type":"method","cluster":"product-design","summary":"Interviews with users and business stakeholders informed the pain points and priorities described in the redesign case study.","evidence":"interviews with users and our business stakeholders","sources":["jazzcash"],"themes":["research","product strategy"]},{"id":"product-goals","title":"Access, discovery, control","type":"goal","cluster":"product-design","summary":"The design goals focused on making actions easier to find, improving service discovery, and giving users more control.","evidence":"improve service discoverability; allow users to have more control over their experience","sources":["jazzcash"],"themes":["usability","product goals"]},{"id":"my-jazzcash","title":"Personalized home services","type":"feature","cluster":"product-design","summary":"A central section let people place their four most-used services on the home screen; business-promoted services sat separately below it.","evidence":"customize their top four most used services","sources":["jazzcash"],"themes":["personalization","navigation"]},{"id":"feature-usage","title":"Reported feature uptake","type":"metric","cluster":"product-design","summary":"The portfolio reports that more than 85% of users used and customized the feature within two months.","details":"This is a project outcome as reported in Haseeb’s portfolio; the underlying analytics or an independent source was not available in the material reviewed.","evidence":"over 85% of users using it and customizing their most used services within the first two months","when":"first two months after redesign","sources":["jazzcash"],"themes":["adoption","measurement"]},{"id":"design-system","title":"Design system as work grew","type":"system","cluster":"product-design","summary":"Reusable components were added alongside new screens, with team huddles used to review and accept additions.","evidence":"we built our design system along the way with every new screen","sources":["jazzcash"],"themes":["design system","teamwork"]},{"id":"usability-tests","title":"Usability measures","type":"metric","cluster":"product-design","summary":"The portfolio reports SEQ and SUPR-Q scores for the redesigned experience, as well as a SUS result for account information.","details":"The page describes these results but does not provide sample sizes, test dates, or study materials; read them as portfolio-reported figures.","evidence":"SEQ scores between 6 and 7; SUPR-Q scores of 4 and above","sources":["jazzcash"],"themes":["research","measurement"]},{"id":"not-a-journal","title":"Not a Journal challenge","type":"project","cluster":"product-design","summary":"A short self-initiated challenge shows another version of the same research-to-interface process, from interviews through personas, journey, prototypes, and reflection.","evidence":"I talked to three friends","details":"Haseeb says the project took roughly 12 hours and notes that a broader interview sample could have surfaced more insights.","sources":["journal"],"themes":["research","prototyping"]},{"id":"leadership-mandate","title":"Leadership as enablement","type":"principle","cluster":"leadership","featured":true,"summary":"Haseeb’s leadership essay defines the job through creating safety, guidance, and room for people to grow, rather than only assigning work.","evidence":"leadership roles entail a lot of responsibility","sources":["leadership-post"],"themes":["leadership","people"]},{"id":"one-on-ones","title":"Meaningful one-on-ones","type":"practice","cluster":"leadership","summary":"He recommends tailoring check-ins to people’s concerns, motivations, roles, and goals.","evidence":"tailor every new conversation around them, not you","sources":["leadership-post"],"themes":["mentoring","communication"]},{"id":"empowerment","title":"Empower, don’t micromanage","type":"principle","cluster":"leadership","summary":"The essay argues that leaders succeed when their teams can deliver without constant intervention.","evidence":"you succeed when your people can deliver without you stepping in at every turn","sources":["leadership-post"],"themes":["trust","leadership"]},{"id":"colleague-views","title":"Colleagues describe the practice","type":"testimony","cluster":"leadership","summary":"Hosted testimonials from a design-operations leader and designers praise Haseeb’s team-building, coaching, and collaborative style.","details":"These are first-person recommendations published on Haseeb’s site. They show how named colleagues describe working with him, not an independently sampled assessment.","evidence":"Mark Lannutti says Haseeb set up a DesignOps practice and standardized design roles, career paths, and work processes","sources":["home","achievements"],"themes":["testimony","team culture"]},{"id":"measurement-framework","title":"Measure the whole system","type":"framework","cluster":"leadership","summary":"In a 2024 essay, Haseeb groups design-team measurement around who is on the team, how work happens, and the outcomes it creates.","evidence":"who is on the team, how the work gets done, and how the work creates business impact","when":"2024-11-15","sources":["metrics"],"themes":["measurement","design operations"]}],"edges":[{"source":"haseeb","target":"career-pivot","label":"describes a move from","kind":"explicit","sources":["about"]},{"source":"career-pivot","target":"design-maturity","label":"later extends into","kind":"inferred"},{"source":"haseeb","target":"current-role","label":"   for (let it = 0; it < iters; it++) {
    const alpha = Math.pow(1 - it / iters, 1.4);
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      if (dx * dx + dy * dy < 1) { dx = rnd() - .5; dy = rnd() - .5; }
      const wd = Math.sqrt(dx * dx * XS * XS + dy * dy) || 1, d = Math.sqrt(dx * dx + dy * dy) || 1;
      const min = a.r + b.r + 95;
      let f = 26000 / (wd * wd); if (wd < min) f += (min - wd) * 0.9;
      f *= alpha + 0.04;
      const fx = dx / d * f, fy = dy / d * f;
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
    }
    for (const e of edges) {
      const a = e.a, b = e.b, dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
      const L = a.cluster === b.cluster ? 150 : 250, f = (d - L) * 0.03 * (alpha + 0.1);
      const fx = dx / d * f, fy = dy / d * f; a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
    for (const n of nodes) {
      if (n.isRoot) continue;
      const s = sector(n.cluster), tx = Math.cos(s) * R * ax, ty = Math.sin(s) * R * ay;
      n.vx += (tx - n.x) * 0.014 * alpha; n.vy += (ty - n.y) * 0.014 * alpha;
      n.x += n.vx * 0.6; n.y += n.vy * 0.6; n.vx *= 0.55; n.vy *= 0.55;
    }
  }
}

/* ---------- SVG build ---------- */
const svgEl = $("graph"), vp = $("vp");
for (const e of edges) {
  e.line = sv("line", { class: "edge" + (e.kind === "inferred" ? " inferred" : "") });
  e.line.append(Object.assign(sv("title"), { textContent: `${e.a.title} → ${e.b.title}: ${e.label} (${e.kind})` }));
  e.text = sv("text", { class: "edge-label" }); e.text.textContent = e.label;
  $("edges").append(e.line); $("edge-labels").append(e.text);
}
for (const n of nodes) {
  const g = sv("g", { class: "node" + (n.isRoot ? " root" : ""), tabindex: 0, role: "button", "aria-label": `${n.title}, ${cap(n.type)}, ${story.clusters[cIndex.get(n.cluster)].label}`, "data-id": n.id });
  g.append(sv("circle", { r: n.r + 11, fill: "transparent" }));
  g.append(sv("circle", { class: "ring", r: n.r + 6 }));
  g.append(sv("circle", { class: "core", r: n.r, stroke: n.color, style: n.isRoot ? "fill:" + n.color : null }));
  if (!n.isRoot) g.append(sv("circle", { class: "dot", r: Math.max(2, n.r * 0.22), fill: n.color }));
  const lab = sv("text", { class: "label", y: n.r + 15 }); lab.textContent = n.title; g.append(lab);
  if (!n.isRoot) { const k = sv("text", { class: "kind", y: n.r + 26 }); k.textContent = cap(n.type); g.append(k); }
  g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n.id, { center: true }); } });
  n.g = g; $("nodes").append(g);
}
function place() {
  for (const e of edges) {
    e.line.setAttribute("x1", e.a.x); e.line.setAttribute("y1", e.a.y); e.line.setAttribute("x2", e.b.x); e.line.setAttribute("y2", e.b.y);
    e.text.setAttribute("x", (e.a.x + e.b.x) / 2); e.text.setAttribute("y", (e.a.y + e.b.y) / 2 - 4);
  }
  for (const n of nodes) n.g.setAttribute("transform", `translate(${n.x.toFixed(1)} ${n.y.toFixed(1)})`);
  drawStoryPath();
}

/* ---------- view (pan / zoom) ---------- */
const view = { x: 0, y: 0, k: 1 };
function applyView() { svgEl.style.setProperty("--ls", Math.min(2.2, Math.max(1, 0.95 / view.k)).toFixed(2)); vp.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`); svgEl.classList.toggle("zoomed", view.k >= 1.15); }
let tweenId = 0;
function tween(to, ms = 480) {
  cancelAnimationFrame(tweenId);
  if (reduceMotion) { Object.assign(view, to); applyView(); return; }
  const from = { ...view }, t0 = performance.now();
  const step = (t) => {
    const p = Math.min(1, (t - t0) / ms), q = 1 - Math.pow(1 - p, 3);
    view.x = from.x + (to.x - from.x) * q; view.y = from.y + (to.y - from.y) * q; view.k = from.k + (to.k - from.k) * q; applyView();
    if (p < 1) tweenId = requestAnimationFrame(step);
  };
  tweenId = requestAnimationFrame(step);
}
const stageBox = () => {
  const W = svgEl.clientWidth, H = svgEl.clientHeight;
  const panelOpen = $("panel").classList.contains("open");
  return { W, H, left: 0, right: panelOpen && !isNarrow() ? Math.min(400, W) : 0, bottom: panelOpen && isNarrow() ? H * 0.58 : 0 };
};
function fit(animate = true, list = nodes) {
  const { W, H, right, bottom } = stageBox();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const n of list) { x0 = Math.min(x0, n.x - n.r - 60); x1 = Math.max(x1, n.x + n.r + 60); y0 = Math.min(y0, n.y - n.r - 30); y1 = Math.max(y1, n.y + n.r + 50); }
  const aw = W - right, ah = H - bottom - 40;
  const k = Math.max(0.2, Math.min(1.6, Math.min(aw / (x1 - x0), ah / (y1 - y0))));
  const to = { k, x: aw / 2 - (x0 + x1) / 2 * k, y: (ah + 0) / 2 - (y0 + y1) / 2 * k + 6 };
  animate ? tween(to) : (Object.assign(view, to), applyView());
}
function center(n) {
  const { W, H, right, bottom } = stageBox(), k = Math.max(view.k, 1);
  tween({ k, x: (W - right) / 2 - n.x * k, y: (H - bottom) / 2 - n.y * k - 10 }, 420);
}
function zoomAt(f, cx, cy) {
  const k = Math.max(0.2, Math.min(4, view.k * f)), r = k / view.k;
  view.x = cx - (cx - view.x) * r; view.y = cy - (cy - view.y) * r; view.k = k; applyView();
}

/* ---------- state + render ---------- */
const S = { selected: null, filter: "all", q: "", list: false, story: null, step: 0 };
const matches = (n) => {
  if (S.filter !== "all" && n.cluster !== S.filter) return false;
  if (!S.q) return true;
  return [n.title, n.summary, n.details, n.type, (n.themes || []).join(" ")].join(" ").toLowerCase().includes(S.q);
};
function render() {
  const sel = S.selected && byId.get(S.selected), nb = sel ? adj.get(sel.id) : null;
  const inStory = S.story ? new Set(S.story.steps) : null;
  let shown = 0;
  for (const n of nodes) {
    const m = matches(n); if (m) shown++;
    let dim = !m;
    if (inStory) dim = dim || !inStory.has(n.id);
    else if (sel && n !== sel && !nb.has(n.id)) dim = true;
    n.g.classList.toggle("dim", dim);
    n.g.classList.toggle("sel", n === sel);
    n.g.setAttribute("aria-pressed", String(n === sel));
  }
  for (const e of edges) {
    const hl = !inStory && sel && (e.a === sel || e.b === sel);
    e.line.classList.toggle("hl", !!hl); e.text.classList.toggle("hl", !!hl);
    let dim = !(matches(e.a) && matches(e.b));
    if (inStory) dim = true; else if (sel && !hl) dim = true;
    e.line.classList.toggle("dim", dim);
  }
  $("empty").classList.toggle("on", shown === 0 && !S.list);
  $("status").textContent = `${nodes.length} nodes · ${edges.length} edges · ${S.q || S.filter !== "all" ? `${shown} match · ` : ""}Click a node to explore the story.`;
  for (const b of $("chips").children) b.setAttribute("aria-pressed", String(b.dataset.c === S.filter));
  for (const b of $("stories").querySelectorAll("button")) b.setAttribute("aria-pressed", String(!!S.story && b.dataset.s === S.story.id));
  if (S.list) renderList();
  drawStoryPath();
}

/* ---------- story mode ---------- */
function drawStoryPath() {
  const p = $("story-path"), bg = $("badges"); bg.textContent = "";
  if (!S.story) { p.setAttribute("d", ""); return; }
  const pts = S.story.steps.map((id) => byId.get(id));
  p.setAttribute("d", pts.map((n, i) => `${i ? "L" : "M"}${n.x.toFixed(1)} ${n.y.toFixed(1)}`).join(" "));
  pts.forEach((n, i) => {
    const g = sv("g", { class: "badge", transform: `translate(${(n.x + n.r * 0.8).toFixed(1)} ${(n.y - n.r * 0.8).toFixed(1)})`, opacity: i === S.step ? 1 : 0.75 });
    g.append(sv("circle", { r: i === S.step ? 10 : 8 })); const t = sv("text"); t.textContent = i + 1; g.append(t); bg.append(g);
  });
}
function startStory(id) {
  const st = storyById.get(id); if (!st) return;
  S.story = st; S.step = 0; S.list = false; syncView();
  $("storybar").classList.add("on"); goStep(0);
}
function goStep(i) {
  const st = S.story; if (!st) return;
  S.step = Math.max(0, Math.min(st.steps.length - 1, i));
  $("sb-step").textContent = `Story · step ${S.step + 1} of ${st.steps.length}`;
  $("sb-title").textContent = st.title; $("sb-sum").textContent = st.summary || "";
  $("sb-prev").disabled = S.step === 0; $("sb-next").disabled = S.step === st.steps.length - 1;
  select(st.steps[S.step], { center: true, keepStory: true });
}
function endStory() { S.story = null; $("storybar").classList.remove("on"); render(); }

/* ---------- detail panel ---------- */
function relRow(e, n) {
  const other = e.a === n ? e.b : e.a, out = e.a === n;
  return el("li", null, el("button", { onclick: () => select(other.id, { center: true }) },
    el("b", { text: other.title }),
    el("span", { class: "rel" }, out ? "→ " : "← ", el("em", { text: e.label }), ` · ${e.kind}`)));
}
function openPanel(n) {
  const p = $("panel"); p.textContent = "";
  const cl = story.clusters[cIndex.get(n.cluster)];
  p.append(el("button", { class: "close", "aria-label": "Close details", text: "×", onclick: () => select(null) }));
  p.append(el("div", { class: "kicker", style: `--c:${n.color}` }, el("i"), el("span", { text: cl.label }), el("span", { text: "·", "aria-hidden": "true" }), el("span", { text: cap(n.type) })));
  p.append(el("h2", { text: n.title }), el("p", { text: n.summary }));
  if (n.details) p.append(el("p", { class: "details", text: n.details }));
  if (n.evidence) p.append(el("h3", { text: "Evidence" }), el("blockquote", { text: n.evidence }));
  if (n.when) p.append(el("h3", { text: "When" }), el("p", { text: n.when }));
  if (n.themes && n.themes.length) p.append(el("h3", { text: "Themes" }), el("div", { class: "tags" }, n.themes.map((t) => el("span", { class: "tag", text: t }))));
  const rel = edges.filter((e) => e.a === n || e.b === n);
  if (rel.length) p.append(el("h3", { text: `Connections (${rel.length})` }), el("ul", { class: "links" }, rel.map((e) => relRow(e, n))));
  const srcs = (n.sources || []).map((id) => srcById.get(id)).filter(Boolean);
  if (srcs.length) p.append(el("h3", { text: "Sources" }), el("ul", { class: "src" }, srcs.map((s) => {
    const u = safeUrl(s.url);
    return el("li", null, u ? el("a", { href: u, target: "_blank", rel: "noopener noreferrer", text: s.title }) : s.title, s.accessed ? el("small", { text: `Accessed ${s.accessed}` }) : null);
  })));
  const inStories = (story.stories || []).filter((s) => s.steps.includes(n.id));
  if (inStories.length && !S.story) p.append(el("h3", { text: "Appears in" }), el("div", { class: "tags" }, inStories.map((s) => el("button", { class: "chip", text: s.title, onclick: () => startStory(s.id) }))));
  p.classList.add("open"); p.scrollTop = 0;
}
function select(id, opts = {}) {
  if (!opts.keepStory && S.story && id) endStoryQuiet();
  S.selected = id;
  const p = $("panel");
  if (id) { openPanel(byId.get(id)); try { history.replaceState(null, "", "#node=" + encodeURIComponent(id)); } catch {} }
  else { p.classList.remove("open"); try { history.replaceState(null, "", location.pathname + location.search); } catch {} }
  render();
  if (id && opts.center && !S.list) center(byId.get(id));
}
function endStoryQuiet() { S.story = null; $("storybar").classList.remove("on"); }

/* ---------- list view ---------- */
function renderList() {
  const box = $("list"); box.textContent = "";
  let any = false;
  for (const c of story.clusters) {
    const items = nodes.filter((n) => n.cluster === c.id && matches(n));
    if (!items.length) continue; any = true;
    box.append(el("section", null,
      el("h2", { style: `--c:${colors[c.id]}` }, el("i"), c.label),
      el("ul", null, items.map((n) => el("li", null, el("button", { class: "item", style: `--c:${n.color}`, onclick: () => select(n.id) },
        el("small", { text: cap(n.type) }), el("b", { text: n.title }), el("span", { text: n.summary })))))));
  }
  if (!any) box.append(el("p", { text: "No nodes match.", style: "color:var(--muted);text-align:center" }));
}
function syncView() {
  $("list").classList.toggle("on", S.list); svgEl.style.visibility = S.list ? "hidden" : "visible";
  $("zoom").style.display = S.list ? "none" : "";
  $("btn-view").textContent = S.list ? "Explore as graph" : "Explore as list"; $("btn-view").setAttribute("aria-pressed", String(S.list));
  $("btn-fit").style.display = S.list ? "none" : "";
  render();
}

/* ---------- toolbar ---------- */
const usedClusters = new Set(nodes.map((n) => n.cluster));
$("chips").append(el("button", { class: "chip", "data-c": "all", text: "All", onclick: () => { S.filter = "all"; render(); } }));
for (const c of story.clusters) if (usedClusters.has(c.id)) $("chips").append(el("button", { class: "chip", "data-c": c.id, style: `--c:${colors[c.id]}`, onclick: () => { S.filter = S.filter === c.id ? "all" : c.id; render(); } }, el("i"), c.label));
if ((story.stories || []).length) {
  $("stories").append(el("span", { text: "Follow a story" }));
  for (const s of story.stories) $("stories").append(el("button", { class: "chip", "data-s": s.id, title: s.summary || "", text: s.title, onclick: () => (S.story && S.story.id === s.id ? endStory() : startStory(s.id)) }));
}
for (const c of story.clusters) if (usedClusters.has(c.id)) $("legend").append(el("span", { style: `--c:${colors[c.id]}` }, el("i"), c.label));
$("legend").append(el("span", { title: "Relationship directly supported by a cited source" }, (() => { const s = sv("svg", { viewBox: "0 0 22 8" }); s.append(sv("line", { x1: 0, y1: 4, x2: 22, y2: 4, stroke: "currentColor", "stroke-width": 1.5 })); return s; })(), "sourced"));
$("legend").append(el("span", { title: "Editorial bridge: an interpretation, not a direct claim" }, (() => { const s = sv("svg", { viewBox: "0 0 22 8" }); s.append(sv("line", { x1: 0, y1: 4, x2: 22, y2: 4, stroke: "currentColor", "stroke-width": 1.5, "stroke-dasharray": "3 4" })); return s; })(), "inferred"));

$("q").addEventListener("input", (e) => { S.q = e.target.value.trim().toLowerCase(); render(); });
$("btn-view").onclick = () => { S.list = !S.list; syncView(); if (!S.list) requestAnimationFrame(() => fit(false)); };
$("btn-fit").onclick = () => fit();
$("btn-reset").onclick = () => { S.filter = "all"; S.q = ""; $("q").value = ""; endStoryQuiet(); layout(); place(); select(null); fit(); };
$("zin").onclick = () => zoomAt(1.3, svgEl.clientWidth / 2, svgEl.clientHeight / 2);
$("zout").onclick = () => zoomAt(1 / 1.3, svgEl.clientWidth / 2, svgEl.clientHeight / 2);
$("sb-prev").onclick = () => goStep(S.step - 1); $("sb-next").onclick = () => goStep(S.step + 1); $("sb-exit").onclick = endStory;
addEventListener("keydown", (e) => {
  const typing = e.target.tagName === "INPUT";
  if (e.key === "/" && !typing) { e.preventDefault(); $("q").focus(); }
  else if (e.key === "Escape") { if (typing) e.target.blur(); else if (S.selected) select(null); else if (S.story) endStory(); }
  else if (S.story && !typing && e.key === "ArrowRight") goStep(S.step + 1);
  else if (S.story && !typing && e.key === "ArrowLeft") goStep(S.step - 1);
});

/* ---------- pointer interaction: pan, zoom, pinch, drag nodes ---------- */
const ptrs = new Map(); let drag = null;
const toWorld = (cx, cy) => { const r = svgEl.getBoundingClientRect(); return [(cx - r.left - view.x) / view.k, (cy - r.top - view.y) / view.k]; };
const pinchInfo = () => { const [a, b] = [...ptrs.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; };
svgEl.addEventListener("pointerdown", (e) => {
  cancelAnimationFrame(tweenId);
  svgEl.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) { drag = { type: "pinch", ...pinchInfo() }; return; }
  const g = e.target.closest && e.target.closest(".node");
  drag = g ? { type: "node", n: byId.get(g.dataset.id), sx: e.clientX, sy: e.clientY, moved: false }
           : { type: "pan", sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false };
});
svgEl.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!drag) return;
  if (drag.type === "pinch" && ptrs.size === 2) {
    const p = pinchInfo(), r = svgEl.getBoundingClientRect();
    zoomAt(p.d / drag.d, p.mx - r.left, p.my - r.top); view.x += p.mx - drag.mx; view.y += p.my - drag.my; applyView(); drag = { type: "pinch", ...p }; return;
  }
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; svgEl.classList.add("dragging"); }
  if (!drag.moved) return;
  if (drag.type === "pan") { view.x = drag.vx + dx; view.y = drag.vy + dy; applyView(); }
  else if (drag.type === "node") { const [wx, wy] = toWorld(e.clientX, e.clientY); drag.n.x = wx; drag.n.y = wy; place(); }
});
const endPtr = (e) => {
  ptrs.delete(e.pointerId); svgEl.classList.remove("dragging");
  if (drag && drag.type !== "pinch" && !drag.moved) { if (drag.type === "node") select(drag.n.id, { center: false }); else if (S.selected && !S.story) select(null); }
  if (ptrs.size < 2) drag = null;
};
svgEl.addEventListener("pointerup", endPtr); svgEl.addEventListener("pointercancel", endPtr);
svgEl.addEventListener("wheel", (e) => { e.preventDefault(); const r = svgEl.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
let sized = svgEl.clientWidth > 0 && svgEl.clientHeight > 0, touched = false;
svgEl.addEventListener("pointerdown", () => { touched = true; }); svgEl.addEventListener("wheel", () => { touched = true; }, { passive: true });
const onSize = () => {
  if (S.list || !svgEl.clientWidth || !svgEl.clientHeight) return;
  if (!sized) { sized = true; layout(); place(); fit(false); return; } // first real size (page was loaded hidden / zero-sized)
  if (!touched && !S.selected && !S.story) fit(false);
};
if (window.ResizeObserver) new ResizeObserver(onSize).observe(svgEl); else addEventListener("resize", onSize);

/* ---------- boot ---------- */
layout(); place(); render(); syncView(); fit(false);
function fromHash() {
  const m = /#(node|story)=([^&]+)/.exec(location.hash); if (!m) return;
  const id = decodeURIComponent(m[2]);
  if (m[1] === "node" && byId.has(id) && S.selected !== id) select(id, { center: true });
  else if (m[1] === "story" && storyById.has(id) && !(S.story && S.story.id === id)) startStory(id);
}
addEventListener("hashchange", fromHash);
fromHash();
})();
</script>
